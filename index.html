<!doctype html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#14181f">
<title>ExamenMaatje 2F</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #f3f4f6;
    color: #14181f;
    font-size: 17px;
    line-height: 1.55;
  }
  .topwrap { position: sticky; top: 0; z-index: 10; }
  header.top {
    background: #14181f;
    color: #fff;
    padding: 14px 18px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .taakbalk {
    background: #1b2129;
    padding: 8px 14px;
    display: flex; gap: 14px; align-items: center; justify-content: center; flex-wrap: wrap;
    border-top: 1px solid #2a313d;
  }
  .taakbalk label {
    font-size: 10.5px; font-weight: 700; text-transform: uppercase;
    letter-spacing: .8px; color: #9aa3b2; display: flex; align-items: center; gap: 7px;
    font-family: inherit; cursor: pointer;
  }
  .taakbalk select {
    font-family: inherit; font-size: 14px; font-weight: 600; color: #14181f;
    background: #fff; border: 1px solid #d6dae3; border-radius: 8px;
    padding: 6px 10px; cursor: pointer; max-width: 170px;
  }
  .logo { font-weight: 800; font-size: 18px; letter-spacing: .3px; display: flex; align-items: center; gap: 8px; }
  .logo em { font-style: normal; border: 1px solid rgba(255,255,255,.45); color: #fff; border-radius: 6px; padding: 1px 7px; font-size: 13px; font-weight: 700; letter-spacing: 1px; }
  .streak { color: #d7dbe4; font-size: 14px; font-weight: 600; letter-spacing: .3px; }
  main { max-width: 560px; margin: 0 auto; padding: 18px 16px 96px; }
  .card {
    background: #fff; border-radius: 12px; padding: 18px;
    box-shadow: 0 1px 4px rgba(18,24,38,.07); margin-bottom: 14px;
  }
  .hero h1 { margin: 4px 0 6px; font-size: 23px; letter-spacing: -.2px; }
  .hero p.sub { margin: 0 0 14px; color: #565f6e; }
  .btn {
    display: block; width: 100%; border: 0; border-radius: 10px;
    padding: 13px 16px; font-size: 16px; font-weight: 700; cursor: pointer;
    margin-bottom: 10px; text-align: center; font-family: inherit; letter-spacing: .2px;
  }
  .btn-primary { background: #14181f; color: #fff; }
  .btn-accent { background: #4f46e5; color: #fff; }
  .btn-green { background: #0f766e; color: #fff; }
  .btn-outline { background: #fff; color: #14181f; border: 1.5px solid #14181f; }
  .btn-soft { background: #e8eaf1; color: #14181f; }
  .btn-small { display: inline-block; width: auto; padding: 8px 14px; font-size: 14px; margin-right: 8px; margin-bottom: 0; }
  .btn:disabled { opacity: .45; cursor: default; }
  .stats { display: flex; gap: 10px; margin: 12px 0; }
  .stat { flex: 1; background: #f5f6f9; border-radius: 10px; padding: 10px; text-align: center; }
  .stat b { display: block; font-size: 21px; color: #14181f; }
  .stat small { color: #565f6e; }
  .tekstcard { cursor: pointer; border: 1.5px solid #e3e6ec; }
  .tekstcard:active { border-color: #4f46e5; }
  .tekstcard h3 { margin: 0 0 4px; font-size: 17px; }
  .meta { color: #565f6e; font-size: 14px; }
  .badge { display: inline-block; background: #ecfdf5; color: #0f766e; border-radius: 999px; padding: 2px 10px; font-size: 12.5px; font-weight: 700; margin-left: 6px; letter-spacing: .3px; }
  .badge-blauw { background: #eef2ff; color: #4338ca; }
  .laagtabs { display: flex; gap: 8px; margin: 12px 0; }
  .laagtabs button {
    flex: 1; border: 1.5px solid #d5dae3; background: #fff; color: #2a3140;
    padding: 10px; border-radius: 9px; font-weight: 700; cursor: pointer; font-size: 14.5px; font-family: inherit;
  }
  .laagtabs button.actief { border-color: #14181f; background: #14181f; color: #fff; }
  .tekst p { margin: 0 0 14px; }
  .tekst h2 { font-size: 19px; margin: 0 0 14px; }
  .w {
    color: #4338ca; font-weight: 700; cursor: pointer;
    text-decoration: underline dotted #8f88e8 2px; text-underline-offset: 3px;
  }
  .w.geleerd { color: #0f766e; text-decoration-color: #0f766e; }
  .vraag { margin-bottom: 18px; }
  .vraag h3 { font-size: 17.5px; margin: 0 0 12px; }
  .optie {
    display: block; width: 100%; text-align: left; background: #fff;
    border: 1.5px solid #d5dae3; border-radius: 9px; padding: 12px 14px;
    margin-bottom: 8px; font-size: 16px; cursor: pointer; font-family: inherit; color: #14181f;
  }
  .optie:disabled { cursor: default; }
  .optie.goed { border-color: #0f766e; background: #ecfdf5; font-weight: 700; }
  .optie.fout { border-color: #b91c1c; background: #fef2f2; }
  .waarom {
    background: #eef2ff; border-left: 3px solid #4338ca;
    padding: 10px 12px; border-radius: 8px; margin: 10px 0; font-size: 15px;
  }
  .flash {
    background: linear-gradient(150deg, #232a3a, #14181f); color: #fff;
    border-radius: 12px; padding: 28px 18px; text-align: center; margin-bottom: 14px;
    min-height: 160px; display: flex; flex-direction: column; justify-content: center;
  }
  .flash .groot { font-size: 25px; font-weight: 800; margin-bottom: 8px; letter-spacing: .2px; }
  .flash .uitleg { font-size: 16.5px; color: #d7dbe4; }
  .flash .vb { font-style: italic; font-size: 14.5px; opacity: .85; margin-top: 8px; }
  .invulzin { font-size: 18.5px; line-height: 1.6; background: #f5f6f9; border-radius: 9px; padding: 14px; margin-bottom: 14px; }
  .blank { display: inline-block; min-width: 90px; border-bottom: 3px solid #4f46e5; text-align: center; color: #4f46e5; font-weight: 800; }
  nav#nav {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: #fff; display: flex; border-top: 1px solid #e3e6ec;
    z-index: 10; max-width: 560px; margin: 0 auto;
  }
  nav#nav button {
    flex: 1; border: 0; background: none; padding: 12px 2px 13px;
    font-size: 10.5px; font-weight: 700; color: #78808f; cursor: pointer; font-family: inherit;
    text-transform: uppercase; letter-spacing: .8px;
    border-top: 2px solid transparent;
  }
  nav#nav button.actief { color: #14181f; border-top-color: #4f46e5; }
  #sheetBack {
    position: fixed; inset: 0; background: rgba(10,14,22,.5); z-index: 20;
  }
  #sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 21;
    background: #fff; border-radius: 16px 16px 0 0; padding: 20px 18px 26px;
    max-width: 560px; margin: 0 auto; box-shadow: 0 -4px 20px rgba(0,0,0,.2);
  }
  #sheet h3 { margin: 0 0 2px; font-size: 21px; color: #14181f; }
  #sheet .soort { color: #78808f; font-size: 13.5px; text-transform: uppercase; letter-spacing: .6px; }
  #sheet .uitleg-regel { margin: 12px 0 4px; font-size: 16.5px; }
  #sheet .voorbeeld { background: #f5f6f9; border-radius: 8px; padding: 8px 12px; font-size: 15px; margin: 8px 0 14px; }
  .sheetknoppen { display: flex; gap: 8px; flex-wrap: wrap; }
  .sheetknoppen .btn { margin-bottom: 0; }
  footer {
    text-align: center; font-size: 12.5px; color: #78808f;
    padding: 10px 16px 84px; max-width: 560px; margin: 0 auto;
  }
  #toast {
    position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
    background: #14181f; color: #fff; padding: 10px 18px; border-radius: 999px;
    font-weight: 600; font-size: 14.5px; z-index: 30; display: none;
  }
  .terug { background: none; border: none; color: #4f46e5; font-weight: 700; font-size: 14.5px; cursor: pointer; padding: 0; margin-bottom: 10px; font-family: inherit; }
  details.hoe { margin-top: 6px; }
  details.hoe summary { font-weight: 700; color: #4f46e5; cursor: pointer; }
  details.hoe ol { padding-left: 20px; }
  .pbalk { background: #e2e6ee; border-radius: 999px; height: 10px; overflow: hidden; margin: 6px 0 12px; }
  .pbalk > div { background: #0f766e; height: 100%; border-radius: 999px; }
  .score-groot { text-align: center; font-size: 42px; font-weight: 800; color: #14181f; margin: 8px 0; letter-spacing: -.5px; }
  .label-boven { text-transform: uppercase; letter-spacing: 1px; font-size: 12px; color: #78808f; font-weight: 700; margin: 0 0 4px; }
  .chip {
    display: inline-block; border: 1.5px solid #d5dae3; background: #fff; color: #2a3140;
    border-radius: 999px; padding: 7px 13px; margin: 0 6px 8px 0; cursor: pointer;
    font-size: 14.5px; font-weight: 600; font-family: inherit;
  }
  .chip-aan { border-color: #4338ca; background: #eef2ff; color: #312e81; }
  .stapbalk { display: flex; gap: 5px; margin: 4px 0 16px; }
  .stapbalk span { flex: 1; height: 4px; border-radius: 2px; background: #e2e6ee; }
  .stapbalk span.aan { background: #4f46e5; }
  .stapnr { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .stapnr b { background: #14181f; color: #fff; border-radius: 999px; width: 26px; height: 26px; display: inline-flex; align-items: center; justify-content: center; font-size: 14px; }
  textarea {
    width: 100%; min-height: 230px; border: 1.5px solid #d5dae3; border-radius: 10px;
    padding: 12px; font-size: 16px; font-family: inherit; line-height: 1.6;
    background: #fff; color: #14181f; resize: vertical;
  }
  textarea:focus { outline: 2px solid #4f46e5; outline-offset: -1px; }
  .checkitem {
    display: flex; gap: 10px; align-items: flex-start; background: #fff;
    border: 1.5px solid #d5dae3; border-radius: 9px; padding: 11px 12px; margin-bottom: 8px;
    cursor: pointer; font-size: 15.5px; text-align: left; font-family: inherit; color: #14181f; width: 100%;
  }
  .checkitem.aan { border-color: #0f766e; background: #ecfdf5; }
  .checkbox { min-width: 20px; height: 20px; border: 1.5px solid #b9bfc9; border-radius: 5px; display: inline-block; margin-top: 2px; }
  .checkitem.aan .checkbox { border-color: #0f766e; background: #0f766e; }
  .voorbeeldtekst { background: #f5f6f9; border-left: 3px solid #0f766e; border-radius: 8px; padding: 12px 14px; font-size: 15.5px; white-space: pre-wrap; }
  .startersnotitie { background: #f5f6f9; border-radius: 9px; padding: 12px; margin: 10px 0; font-size: 15.5px; white-space: pre-wrap; }
</style>
</head>
<body>

<div class="topwrap">
<header class="top">
  <div class="logo">ExamenMaatje <em>2F</em></div>
  <div class="streak" id="streakBadge">0 dagen</div>
</header>
<div class="taakbalk">
  <label>Leerweg
    <select id="selLeerweg">
      <option value="bb">Basis (bb)</option>
      <option value="kb">Kader (kb)</option>
    </select>
  </label>
  <label>Vak
    <select id="selVak">
      <option value="alle">Alle vakken</option>
      <option value="Nederlands">Nederlands</option>
      <option value="Engels">Engels</option>
      <option value="Natuur-scheikunde">Natuur-scheikunde</option>
      <option value="Wiskunde">Wiskunde</option>
      <option value="Economie">Economie</option>
      <option value="Biologie">Biologie</option>
    </select>
  </label>
</div>
</div>

<main id="app"></main>

<div id="sheetBack" hidden></div>
<div id="sheet" hidden></div>
<div id="toast"></div>

<footer>
  ExamenMaatje slaat niets op een server op. Je voortgang en teksten blijven op dit toestel. Geen account, geen tracking, gratis.
</footer>

<nav id="nav">
  <button data-nav="home">Start</button>
  <button data-nav="teksten">Teksten</button>
  <button data-nav="woordjes">Woordjes</button>
  <button data-nav="schrijven">Schrijven</button>
  <button data-nav="voortgang">Voortgang</button>
</nav>

<script>
/* ============================================================
   EXAMENMAATJE 2F — NT2-leerlingen klas 3/4 vmbo basis/kader
   Eén bestand, geen server, geen accounts (AVG-proof).

   CONTENT AANPASSEN (zelf examens invoeren kan!):
   - INVULSJABLONEN: direct na de openingsregel van WOORDEN en TEKSTEN
                    staan kant-en-klare sjablonen met uitleg. Kopieer zo'n
                    sjabloon, vul het in en plak het in de lijst.
   - WOORDEN      : woordenbank (u = uitleg, v = voorbeeldzin, s = woordsoort,
                    optioneel t = "en" voor Engelse woorden: voorlezen met Engelse stem)
   - TEKSTEN      : teksten + vragen; markeer moeilijke woorden met [[woord]]
                    of [[woord|andere schrijfwijze]], bv. [[verdienen|verdient]]
                    Engelse teksten krijgen taal: "en" en niveaubadge: "A2";
                    vragen zijn (net als op het examen) in het Nederlands
                    Optioneel per tekst: leerweg: "bb" of "kb" (default bb) en
                    vak: "Nederlands", "Engels", "Natuur-scheikunde", "Wiskunde",
                    "Economie" of "Biologie" (default: Nederlands, behalve bij
                    taal: "en" => Engels). De taakbalk filtert hierop.
   - SCHRIJF      : schrijfopdrachten (e-mail/bericht, examenformaat 2F),
                    zelfde optionele leerweg/vak-velden als TEKSTEN
   ============================================================ */

var WOORDEN = {
  /* ----------------------------------------------------------------
     INVULSJABLOON VOOR EEN NIEUW WOORD
     Kopieer het voorbeeld hieronder, plak het onderaan in deze lijst
     (met een komma na het vorige woord) en vul het in.
     ---------------------------------------------------------------- */
  /* VOORBEELD:
  "nieuw woord": { u: "Uitleg van het woord in gewone woorden.", v: "Voorbeeldzin met het nieuwe woord er precies zo in.", s: "woordsoort" },
  Bij een Engels woord komt er één veld bij:
  "english word": { u: "Nederlandse uitleg.", v: "Example sentence with the english word.", s: "woordsoort (Engels)", t: "en" },
  Let op: bij de invuloefening zoekt de app het woord terug in de
  voorbeeldzin v. Zet het woord dus precies zo in de zin. */
  "solliciteren": { u: "Je vraagt of je ergens mag werken.", v: "Ik ga solliciteren bij de supermarkt.", s: "werkwoord" },
  "vacature": { u: "Een tekst waarin staat: we zoeken iemand voor dit werk.", v: "Ik heb een leuke vacature gezien.", s: "zelfstandig naamwoord" },
  "vakkenvuller": { u: "Iemand die de producten in de schappen zet.", v: "De vakkenvuller werkt op zaterdag.", s: "zelfstandig naamwoord" },
  "schappen": { u: "De planken in een winkel waar producten liggen.", v: "De cola staat in schap 3.", s: "zelfstandig naamwoord (meervoud)" },
  "controleren": { u: "Kijken of iets goed of nog goed is.", v: "De juf controleert je huiswerk.", s: "werkwoord" },
  "vers": { u: "Niet oud. Net gemaakt of net gekocht.", v: "Dit brood is nog vers.", s: "bijvoeglijk naamwoord" },
  "minimaal": { u: "Niet minder dan. Ten minste.", v: "Je moet minimaal 15 jaar zijn.", s: "bijwoord" },
  "ervaring": { u: "Dingen die je al eerder hebt gedaan, bijvoorbeeld in werk.", v: "Hij heeft ervaring met kassawerk.", s: "zelfstandig naamwoord" },
  "training": { u: "Les waarin je leert hoe je het werk moet doen.", v: "De training duurt twee uur.", s: "zelfstandig naamwoord" },
  "verdienen": { u: "Geld krijgen voor je werk.", v: "Zij verdient 4 euro per uur.", s: "werkwoord" },
  "korting": { u: "Je betaalt minder dan de normale prijs.", v: "Studenten krijgen korting op kaartjes.", s: "zelfstandig naamwoord" },
  "bovendien": { u: "Ook. Daarnaast.", v: "Het is goedkoop en bovendien mooi.", s: "bijwoord" },
  "gezellig": { u: "Leuk om bij te zijn. Prettig samen.", v: "We hadden een gezellige dag.", s: "bijvoeglijk naamwoord" },
  "vermelden": { u: "Opschrijven of zeggen in een bericht.", v: "Vermeld je naam en je leeftijd.", s: "werkwoord" },

  "stage": { u: "Werk waarbij je leert hoe een vak echt gaat.", v: "Mijn stage is bij de garage.", s: "zelfstandig naamwoord" },
  "spannend": { u: "Iets waar je zenuwachtig van bent, maar wat je wel leuk vindt.", v: "De wedstrijd was spannend.", s: "bijvoeglijk naamwoord" },
  "indruk": { u: "Wat iemand van je vindt nadat die je heeft gezien.", v: "Je maakt een goede eerste indruk.", s: "zelfstandig naamwoord" },
  "eerder": { u: "Vroeger dan een ander of dan de afgesproken tijd.", v: "Kom tien minuten eerder.", s: "bijwoord" },
  "serieus": { u: "Je doet je best en vindt het belangrijk.", v: "Hij neemt zijn werk serieus.", s: "bijvoeglijk naamwoord" },
  "vragen stellen": { u: "Iets vragen als je het niet snapt.", v: "Stel vooral veel vragen op je stage.", s: "werkwoord" },
  "aanbieden": { u: "Vragen of je iets mag doen, zoals helpen.", v: "Ik bied aan om te helpen.", s: "werkwoord" },
  "opdracht": { u: "Een taak die je moet doen.", v: "Deze opdracht is bijna klaar.", s: "zelfstandig naamwoord" },
  "gemotiveerd": { u: "Je wilt het echt doen. Je hebt zin om te werken.", v: "Zij is een gemotiveerde leerling.", s: "bijvoeglijk naamwoord" },
  "bedenken": { u: "Denken en onthouden in je hoofd.", v: "Bedenk: je bent er om te leren.", s: "werkwoord" },
  "stagebegeleider": { u: "De persoon op je werk die je helpt en jou iets leert.", v: "Vraag het aan je stagebegeleider.", s: "zelfstandig naamwoord" },
  "normaal": { u: "Iets wat vaak gebeurt. Niet vreemd.", v: "Een fout maken is normaal.", s: "bijvoeglijk naamwoord" },
  "fouten": { u: "Dingen die je verkeerd doet.", v: "Iedereen maakt soms fouten.", s: "zelfstandig naamwoord (meervoud)" },
  "wachten": { u: "Blijven staan of zitten tot er iets gebeurt.", v: "Wacht niet tot iemand je helpt.", s: "werkwoord" },

  "stappen": { u: "Kleine onderdelen van een plan: stap 1, stap 2, stap 3.", v: "Volg de drie stappen in de tekst.", s: "zelfstandig naamwoord (meervoud)" },
  "tieners": { u: "Jongeren van ongeveer 13 tot 19 jaar.", v: "Veel tieners sparen niet.", s: "zelfstandig naamwoord (meervoud)" },
  "uitgeven": { u: "Geld gebruiken om iets te kopen.", v: "Ik geef te veel geld uit aan games.", s: "werkwoord" },
  "halverwege": { u: "In het midden van iets, zoals de maand of een wedstrijd.", v: "Halverwege de maand is mijn geld op.", s: "bijwoord" },
  "portemonnee": { u: "Het mapje waarin je je geld bewaart.", v: "Mijn portemonnee is leeg.", s: "zelfstandig naamwoord" },
  "noteren": { u: "Kort opschrijven.", v: "Noteer elke dag wat je koopt.", s: "werkwoord" },
  "lijken": { u: "Het ziet eruit alsof het zo is. Je denkt dat het zo is.", v: "Dat lijkt weinig geld, maar het is veel.", s: "werkwoord" },
  "schrikken": { u: "Even heel verbaasd zijn, bijvoorbeeld van een hoog bedrag.", v: "Je schrikt van wat je allemaal uitgeeft.", s: "werkwoord" },
  "verdelen": { u: "In stukken of delen doen.", v: "Verdeel je geld in drie delen.", s: "werkwoord" },
  "sparen": { u: "Geld bewaren voor later. Het niet uitgeven.", v: "Ik spaar voor een nieuwe telefoon.", s: "werkwoord" },
  "nodig": { u: "Iets dat je moet hebben of moeten gebruiken.", v: "Dit heb ik eigenlijk niet nodig.", s: "bijvoeglijk naamwoord" },
  "besparen": { u: "Zorgen dat je geld overhoud. Minder uitgeven.", v: "Zo bespaar je tien euro per week.", s: "werkwoord" },
  "moeite": { u: "Iets is lastig om te doen. Je moet er je best voor doen.", v: "Je bespaart geld zonder moeite.", s: "zelfstandig naamwoord" },
  "overhouden": { u: "Nog hebben nadat je alles hebt betaald.", v: "Ik houd elke maand geld over.", s: "werkwoord" },

  "geschikt": { u: "Je past bij iets. Je kunt het werk goed doen.", v: "Ik ben geschikt voor dit werk.", s: "bijvoeglijk naamwoord" },
  "verzoek": { u: "Iets wat je aanvraagt of vraagt aan iemand.", v: "Ik stuur een verzoek naar de gemeente.", s: "zelfstandig naamwoord" },
  "excursie": { u: "Een schoolreisje waarbij je iets leert.", v: "De excursie gaat naar het museum.", s: "zelfstandig naamwoord" },

  "gehoorschade": { u: "Schade aan je gehoor. Je kunt daarna slechter horen.", v: "Harde muziek kan gehoorschade geven.", s: "zelfstandig naamwoord" },
  "verband": { u: "Een link tussen twee dingen. Het een heeft met het ander te maken.", v: "Er is een verband tussen hard geluid en slecht gehoor.", s: "zelfstandig naamwoord" },
  "vervolgonderzoek": { u: "Een nieuw onderzoek, na het eerste onderzoek.", v: "Na het eerste onderzoek startte een vervolgonderzoek.", s: "zelfstandig naamwoord" },
  "gesuis": { u: "Een zoemend geluid in je oor.", v: "Na het feest had ik een gesuis in mijn oor.", s: "zelfstandig naamwoord" },
  "beschadiging": { u: "Iets is kapot of kapot gemaakt.", v: "De beschadiging aan mijn oor is blijvend.", s: "zelfstandig naamwoord" },
  "vergelijken": { u: "Twee dingen naast elkaar zetten: wat lijkt op elkaar?", v: "Vergelijk het met een brandwond.", s: "werkwoord" },

      "Réka, who is being [[home-schooled]] by her parents and speaks fluent English, Spanish and Hungarian, says she's been taught lessons in life that she would have never learned in a classroom. 'I do go to school – it just doesn't have four walls,' she said. 'The experience I'm having now, I don't think I can learn about it in a classroom. You would read about the kind of experiences I'm having in a book. But really, it is just so much more different to experience it all in real life.'",
      "As part of their endless journey, Réka says her most [[memorable]] experience so far would be the five days she spent living in the village of Choa Choa located in the high mountains of Peru – one of the most far-away places on the planet. 'The people and the way in which they welcomed us was really inspiring. It's the simple way they live – without electricity, TV or the Internet and yet, they had something a great deal more valuable. This is a place that makes you aware that you have to work together and not compete. This is the best lesson I have learned.'",

      "It wasn't all medals and crossing finishing lines. Through thunder and hail, at 2am before a flight, and through sore muscles, Mr Valentine ran every single day. One morning, it was a [[blistering]] 49 degrees Celsius but he ran anyway. His foot [[swelled]] up so much he couldn't fit it into his shoe the next day. Instead of taking a day off, Mr Valentine cut holes into the sides of the shoe to widen them and used [[improvised]] shoelaces to fasten them to his foot.",
      "While many runners spend hundreds of dollars a year on the latest wearable technology, Mr Valentine didn't use technology. 'I always time my races with a watch but that's it,' he said. He wears shorts and T-shirt, but no belt with water bottle or special running outfit. 'In the end it was just to get the thing done. I didn't want to spend a lot of time thinking about where I was running,' he said.",

      "Why do you love your job? It's like dreaming of flying. When you do a great performance on the trapeze and everything goes well, it's such an incredible feeling – and you try to project that feeling to the audience. So it's a physical challenge, but it's also an art.",
      "What's tough about it? Working at such a high level every day. Sometimes you wake up with a pain in your tummy, but you still have to perform. I have [[cramps]] in my hands from holding on to the trapeze bar, but that doesn't bother me as much as my sore muscles. I like to have a massage once a week.",
      "What skills do you need? You've got to be talented, but also have the strength to cope with the intense physical training. You can't be at all nervous – when there are 5,000 people watching you, you need to [[keep your cool]]. And you've got to be adaptable, because we change cities about once every six weeks.",

      "(1) Hoog boven ons hoofd vliegt een enorme berg [[puin]] in de ruimte rond. En dat zal de komende jaren alleen maar meer worden. De Europese ruimtevaartorganisatie ESA wil daar iets aan doen. De ruimteorganisatie laat een puinruimrobot maken met robotarmen om troep uit de ruimte te plukken.",

      "(4) Het droeve nieuws is: er zal de komende jaren alleen maar meer [[puin]] bij komen. Bedrijven als SpaceX, Amazon en Samsung willen duizenden nieuwe satellieten in het heelal hangen, voor goede communicatie, weersvoorspellingen, navigatie en snel internet. SpaceX heeft al een vergunning gekregen voor het lanceren van twaalfduizend satellieten, en wil daarna nog dertigduizend omhoog schieten. Maar al die satellieten kunnen stukgaan. Nu al zwerven er meer dan drieduizend kapotte satellieten in de ruimte.",

      "(3) Onlangs maakte de IUCN (International Union for Conservation of Nature) bekend dat het aantal giraffen in het wild drastisch is gedaald. De internationale natuurorganisatie heeft de soort daarom op de zogenoemde Rode Lijst van beschermde diersoorten gezet. In dertig jaar tijd slonk het aantal giraffen met bijna 40 procent, van zo'n 160.000 giraffen in 1985 tot iets meer dan 97.000 vorig jaar. De dieren raken steeds meer [[in de verdrukking raken|in de verdrukking]] door grootschalige jacht om hun vlees en verlies van leefgebied door landbouw en mijnbouw. Er zijn nu vier keer meer olifanten op aarde dan giraffen. 'Mensen zijn zich er niet van bewust dat ze stilletjes uitsterven', schrijft de IUCN.",
      "(4) Giraffen komen in de natuur alleen voor in Afrika. 'Ze verdienen het om met rust gelaten te worden', vindt bioloog Midas Dekkers. Dekkers noemt de giraffe 'een toverbeest'. 'Neem alleen al de bloedsomloop van het dier. Hij moet al dat bloed door die enorme nek naar boven persen. Een enorme prestatie, waarvoor hij zijn hartje heeft moeten opvoeren. Nadeel daarvan is wel dat giraffen in gevangenschap vaak overlijden aan hartfalen.'",
      "(5) Toch heeft vrijwel elke dierentuin een paar giraffen. Het zijn echte [[publiekstrekker]]s. 'Dierentuinen hebben soms zelfs zoveel giraffen dat ze aan de leeuwen worden gevoerd', merkt Dekkers venijnig op. De eerste exemplaren werden aan het begin van de 19de eeuw naar Europa gehaald. Tegenwoordig bouwen dierentuinen enorme savannes na, maar die giraffe blijft dankzij zijn hoge lijf makkelijk te spotten.",
      "(6) In het wild heeft de giraffe nogal pech met die lange nek van hem, vervolgt Dekkers. 'Jagers hebben hem onmiddellijk in de smiezen. Eigenlijk is het bezopen zo lang als de giraffe is. Het dier heeft een foutje gemaakt in de evolutie. Hij heeft al zijn kaarten gezet op het knabbelen aan de allerhoogste boomblaadjes, terwijl iedere aap de giraffe had kunnen vertellen dat je helemaal geen lange nek nodig hebt om bovenin de boom te komen: je kan ook klimmen. Als de giraffe niet oppast, kunnen niet alleen de jagers, de landbouw of de stad de ondergang betekenen, maar ook die nek van hem.'"

      "(5) 'Vergelijk het met een proefwerkweek op school waarvan je op voorhand weet dat het niks gaat worden. In de weken ervoor ben je gestrest. Je komt in een soort [[tunnelvisie]] terecht en denkt alleen maar aan de korte termijn. Mensen met financiële problemen hebben dat gevoel elke dag. Jong of oud, dat maakt niet uit.'",

      "(7) 'Vaak hoef je maar een paar formulieren in te vullen om hulp te krijgen. Maar voor de mensen in een stresssituatie voelt het invullen van een paar digitale formulieren hetzelfde als het beklimmen van de Mount Everest. In deze gevallen heb je levende mensen nodig waar geluid uit komt en die doorvragen.'",

      "(1) Buiten sporten is gezond, ook al komt de regen met bakken uit de hemel. Of mogen ze best een training overslaan? De eerste - flinke - herfstbuien leiden ook weer tot de eerste bezorgde vragen in de groepsapp. Gaat de training door? Allemaal duimpjes als de boel wordt [[afgelasten|afgelast]]. Maar dat beetje regen! Ze zijn toch niet van suiker? Of is doorweekt raken en nat op de fiets terug naar huis niet zo verstandig voor lijf en motivatie van een kind?",

      "(4) 'Het lichaam functioneert het best binnen bepaalde grenzen, tussen 35 en 39 graden. Koel je heel erg af, dan is de [[doorbloeding]] minder en worden alle functies minder. En bij kinderen gaat dat nog wat sneller. Een rustige cooling down helpt om afvalstoffen kwijt te raken. Dus droge kleren in de tas, zodat ze zich kunnen omkleden. Of een goede regenjas die de warmte vasthoudt. Maar van één keer met de auto worden het vast geen watjes.'",
      "(5) Thuisblijven, met de auto brengen: sportpsycholoog Ivo Spanjersberg zou dat een verkeerd signaal vinden. Tuurlijk, een herfststorm met [[hoosbui]]en en windkracht tien, dan kan die fiets wel even in de achterbak. 'Maar ik zou er echt een uitzondering van maken. Kinderen zijn in principe lui. Als ze gebracht kunnen worden, zullen ze geen nee zeggen. En in Nederland regent het nogal eens.'",

/* ---------- opslag (alleen op dit toestel) ---------- */
function store(k, d) {
  try { var v = localStorage.getItem("em2f_" + k); return v ? JSON.parse(v) : d; }
  catch (e) { return d; }
}
function set(k, v) { try { localStorage.setItem("em2f_" + k, JSON.stringify(v)); } catch (e) {} }
function geleerd() { return store("geleerd", []); }
function addGeleerd(w) {
  var g = geleerd();
  if (g.indexOf(w) === -1) { g.push(w); set("geleerd", g); }
}
function gelezen() { return store("gelezen", []); }
function addGelezen(id) {
  var g = gelezen();
  if (g.indexOf(id) === -1) { g.push(id); set("gelezen", g); }
}
function scores() { return store("scores", {}); }
function schrijfOpslag() { return store("schrijf", {}); }
function alleWoorden() {
  var alle = [];
  TEKSTEN.forEach(function (t) { alle = alle.concat(t.woorden); });
  return alle;
}

/* ---------- streak ---------- */
function dagString(d) {
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function touchStreak() {
  var nu = new Date();
  var vandaag = dagString(nu);
  var gisteren = new Date(nu.getTime() - 86400000);
  var st = store("streak", { last: "", count: 0 });
  if (st.last === vandaag) return;
  st.count = (st.last === dagString(gisteren)) ? st.count + 1 : 1;
  st.last = vandaag;
  set("streak", st);
}
function updateStreakBadge() {
  var st = store("streak", { last: "", count: 0 });
  document.getElementById("streakBadge").textContent = st.count + (st.count === 1 ? " dag" : " dagen");
}

function plainText(zin) {

}

    var naam = w;
    var show = disp || w;
    var klasse = geleerd().indexOf(naam) !== -1 ? "w geleerd" : "w";

/* ---------- navigatie & state ---------- */
var view = "home";
var cur = { tekstId: null, laag: "origineel" };
var quiz = { tekstId: null, i: 0, goed: 0, gekozen: null };
var trainer = { mode: null, scope: "alle", pool: [], i: 0, goed: 0, flipped: false, gekozen: null, opties: [], gevraagd: null };
var sw = { id: null, stap: 1, woorden: [], starters: [], tekst: "", checks: [], toonVoorbeeld: false, toonJouwTekst: false };

/* ---------- taakbalk: filter op leerweg (bb/kb) en vak ---------- */
var VAKKEN = ["Nederlands", "Engels", "Natuur-scheikunde", "Wiskunde", "Economie", "Biologie"];
var filter = store("filter", { leerweg: "bb", vak: "alle" });
if (filter.leerweg !== "bb" && filter.leerweg !== "kb") filter.leerweg = "bb";
if (filter.vak !== "alle" && VAKKEN.indexOf(filter.vak) === -1) filter.vak = "alle";
function tekstVak(t) { return t.vak || (t.taal === "en" ? "Engels" : "Nederlands"); }
function tekstLeerweg(t) { return t.leerweg || "bb"; }
function schrijfVak(o) { return o.vak || "Nederlands"; }
function schrijfLeerweg(o) { return o.leerweg || "bb"; }
function actieveTeksten() {
  return TEKSTEN.filter(function (t) {
    return tekstLeerweg(t) === filter.leerweg && (filter.vak === "alle" || tekstVak(t) === filter.vak);
  });
}
function actieveSchrijf() {
  return SCHRIJF.filter(function (o) {
    return schrijfLeerweg(o) === filter.leerweg && (filter.vak === "alle" || schrijfVak(o) === filter.vak);
  });
}
function actieveWoorden() {
  var alle = [];
  actieveTeksten().forEach(function (t) { alle = alle.concat(t.woorden); });
  return alle;
}
function filterLabel() {
  var vak = filter.vak === "alle" ? "alle vakken" : filter.vak;
  return vak + " · " + (filter.leerweg === "bb" ? "basis (bb)" : "kader (kb)");
}
function legeKeuzeKaart(wat) {
  return '<div class="card" style="text-align:center">' +
    '<h2>Nog geen ' + wat + '</h2>' +
    '<p class="meta">Voor <b>' + filterLabel() + '</b> staan hier nog geen ' + wat + '. Ze kunnen worden toegevoegd, bijvoorbeeld uit het echte examen. Kies voor nu hierboven een ander vak of een andere leerweg.</p>' +
    '</div>';
}
function setFilter(nieuw) {
  filter = nieuw;
  set("filter", filter);
  document.getElementById("selLeerweg").value = filter.leerweg;
  document.getElementById("selVak").value = filter.vak;
  if (view === "lezer" || view === "quiz") {
    var t = leesKaart();
    if (!t || actieveTeksten().indexOf(t) === -1) { ga("teksten"); return; }
  }
  if (view === "schrijf") {
    var o = swOpdracht();
    if (!o || actieveSchrijf().indexOf(o) === -1) { ga("schrijven"); return; }
  }
  if (view === "trainer" && trainer.pool.length === 0) { ga("woordjes"); return; }
  render();
}

function ga(naar) {
  ttsCancel();
  view = naar;
  render();
  window.scrollTo(0, 0);
}
function leesKaart() {
  return TEKSTEN.find(function (t) { return t.id === cur.tekstId; }) || null;
}
function openTekst(id, laag) {
  ttsCancel();
  cur.tekstId = id;
  cur.laag = laag || "origineel";
  addGelezen(id);
  view = "lezer";
  render();
  window.scrollTo(0, 0);
}
function startQuiz(id) {
  ttsCancel();
  quiz = { tekstId: id, i: 0, goed: 0, gekozen: null };
  view = "quiz";
  render();
  window.scrollTo(0, 0);
}
function shuffle(a) {
  var arr = a.slice();
  for (var i = arr.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
  }
  return arr;
}
function startTrainer(mode, scope) {
  var pool = [];
  if (scope === "alle") { pool = shuffle(actieveWoorden()); }
  else {
    var t = TEKSTEN.find(function (x) { return x.id === scope; });
    pool = t ? shuffle(t.woorden) : shuffle(actieveWoorden());
  }
  if (!pool.length) { toast("Geen woordjes voor deze keuze. Kies bovenin een ander vak of een andere leerweg."); return; }
  ttsCancel();
  trainer = { mode: mode, scope: scope, pool: pool, i: 0, goed: 0, flipped: false, gekozen: null, opties: [], gevraagd: null };
  if (mode === "invul") maakInvulVraag();
  view = "trainer";
  render();
  window.scrollTo(0, 0);
}
function maakInvulVraag() {
  if (trainer.i >= trainer.pool.length) { trainer.opties = []; return; }
  var w = trainer.pool[trainer.i];
  var af = trainer.pool.filter(function (x) { return x !== w; });
  var distr = shuffle(af).slice(0, 3);
  trainer.opties = shuffle([w].concat(distr));
  trainer.gevraagd = w;
}

/* ---------- schrijfvaardigheid ---------- */
function swOpdracht() {
  return SCHRIJF.find(function (o) { return o.id === sw.id; }) || null;
}
function openSchrijf(id) {
  ttsCancel();
  sw = { id: id, stap: 1, woorden: [], starters: [], tekst: "", checks: [], toonVoorbeeld: false, toonJouwTekst: false };
  var opgeslagen = schrijfOpslag()[id];
  if (opgeslagen && opgeslagen.tekst) { sw.tekst = opgeslagen.tekst; }
  view = "schrijf";
  render();
  window.scrollTo(0, 0);
}
function swStap(n) {
  var o = swOpdracht();
  if (!o) return;
  if (n === 4 && !sw.tekst) {
    sw.tekst = sw.starters.join("\n") + (sw.starters.length ? "\n" : "");
  }
  if (n === 4 && sw.tekst) { /* bewaren wat de leerling getypt heeft */ }
  var opgeslagen = schrijfOpslag();
  opgeslagen[sw.id] = { tekst: sw.tekst, afgerond: opgeslagen[sw.id] ? opgeslagen[sw.id].afgerond : false };
  set("schrijf", opgeslagen);
  sw.stap = n;
  sw.toonVoorbeeld = false;
  sw.toonJouwTekst = false;
  render();
  window.scrollTo(0, 0);
}
function swBewaarTekst() {
  var opgeslagen = schrijfOpslag();
  var rec = opgeslagen[sw.id] || { afgerond: false };
  rec.tekst = sw.tekst;
  opgeslagen[sw.id] = rec;
  set("schrijf", opgeslagen);
  touchStreak();
}
function swRondAf() {
  swBewaarTekst();
  var opgeslagen = schrijfOpslag();
  opgeslagen[sw.id].afgerond = true;
  set("schrijf", opgeslagen);
  touchStreak();
  toast("Opdracht afgerond. Goed gedaan.");
  sw.stap = 5;
  sw.toonJouwTekst = true;
  render();
}
function aantalWoorden(t) {
  if (!t || !t.trim()) return 0;
  return t.trim().split(/\s+/).filter(Boolean).length;
}

/* ---------- woorden-popup ---------- */
function openWoord(w) {
  var info = WOORDEN[w];
  if (!info) return;
  stopVoorlezen();
  var isGeleerd = geleerd().indexOf(w) !== -1;
  var sheet = document.getElementById("sheet");
  var back = document.getElementById("sheetBack");
  sheet.innerHTML =
    '<h3>' + w + '</h3>' +
    '<div class="soort">' + info.s + '</div>' +
    '<div class="uitleg-regel">' + info.u + '</div>' +
    '<div class="voorbeeld">' + info.v + '</div>' +
    '<div class="sheetknoppen">' +
    '<button class="btn btn-soft btn-small" data-act="woord-luister" data-w="' + w + '">' + (ttsStatus === "uit" ? "Voorlezen" : "Stoppen") + '</button>' +
    '<button class="btn btn-green btn-small" data-act="woord-geleerd" data-w="' + w + '">' + (isGeleerd ? "In je lijst" : "Geleerd") + '</button>' +
    '<button class="btn btn-outline btn-small" data-act="woord-close">Sluiten</button>' +
    '</div>';
  sheet.hidden = false;
  back.hidden = false;
}
function sluitWoord() {
  document.getElementById("sheet").hidden = true;
  document.getElementById("sheetBack").hidden = true;
  if (view === "lezer") render();
}

/* ---------- views ---------- */
function render() {
  var app = document.getElementById("app");
  var html = "";
  if (view === "home") html = viewHome();
  else if (view === "teksten") html = viewTeksten();
  else if (view === "lezer") html = viewLezer();
  else if (view === "quiz") html = viewQuiz();
  else if (view === "woordjes") html = viewWoordjes();
  else if (view === "trainer") html = viewTrainer();
  else if (view === "schrijven") html = viewSchrijven();
  else if (view === "schrijf") html = viewSchrijf();
  else if (view === "voortgang") html = viewVoortgang();
  app.innerHTML = html;

  var navMap = { home: "home", teksten: "teksten", lezer: "teksten", quiz: "teksten", woordjes: "woordjes", trainer: "woordjes", schrijven: "schrijven", schrijf: "schrijven", voortgang: "voortgang" };
  var buttons = document.querySelectorAll("#nav button");
  for (var i = 0; i < buttons.length; i++) {
    buttons[i].classList.toggle("actief", buttons[i].getAttribute("data-nav") === navMap[view]);
  }
  updateStreakBadge();
}

function viewHome() {
  var st = store("streak", { count: 0 });
  var swk = schrijfOpslag();
  var teksten = actieveTeksten();
  var schrijfLijst = actieveSchrijf();
  var actW = actieveWoorden();
  var g = geleerd().filter(function (w) { return actW.indexOf(w) !== -1; }).length;
  var swKlaar = schrijfLijst.filter(function (o) { return swk[o.id] && swk[o.id].afgerond; }).length;
  var label = (filter.vak === "alle" ? "Alle vakken" : filter.vak) + " · " + (filter.leerweg === "bb" ? "vmbo-bb" : "vmbo-kb");
  return '' +
    '<div class="card hero">' +
    '<div class="label-boven">' + label + '</div>' +
    '<h1>Oefenen op jouw tempo</h1>' +
    '<p class="sub">Korte sessies: een tekst lezen, woordjes doen of een schrijfopdracht maken. Alles blijft op dit toestel.</p>' +
    '<div class="stats">' +
    '<div class="stat"><b>' + st.count + '</b><small>dagen streak</small></div>' +
    '<div class="stat"><b>' + teksten.length + '</b><small>teksten voor je keuze</small></div>' +
    '<div class="stat"><b>' + g + '</b><small>woorden geleerd</small></div>' +
    '<div class="stat"><b>' + swKlaar + '/' + schrijfLijst.length + '</b><small>schrijfopdrachten</small></div>' +
    '</div>' +
    '<button class="btn btn-primary" data-act="open-eerste-tekst">Tekst lezen</button>' +
    '<button class="btn btn-accent" data-act="start-flash-alle">Woordjes oefenen (5 min)</button>' +
    '<button class="btn btn-outline" data-act="open-schrijf-eerste">Schrijfopdracht maken</button>' +
    '<details class="hoe"><summary>Hoe werkt ExamenMaatje?</summary><ol>' +
    '<li><b>Kies bovenin</b> je leerweg (bb of kb) en je vak. De app laat dan alleen de bijpassende teksten zien.</li>' +
    '<li><b>Lees een tekst</b> in twee versies: Eenvoudig en examen. Tik op een gemarkeerd woord voor uitleg.</li>' +
    '<li><b>Doe de examenvragen</b> in echte examenstijl, met uitleg waarom iets goed of fout is.</li>' +
    '<li><b>Maak een schrijfopdracht</b> in vijf stappen, net als op het examen: van woordweb tot zelfcheck.</li>' +
    '<li><b>Oefen je woordjes</b> elke dag vijf minuten. Kleine sessies, groot effect.</li>' +
    '</ol></details>' +
    '</div>';
}

function viewTeksten() {
  var sc = scores();
  var g = gelezen();
  var lijst = actieveTeksten();
  if (!lijst.length) return legeKeuzeKaart("teksten");
  var kaarten = lijst.map(function (t) {
    var badge = "";
    if (sc[t.id]) badge = '<span class="badge">Vragen: ' + sc[t.id] + '</span>';
    else if (g.indexOf(t.id) !== -1) badge = '<span class="badge badge-blauw">Gelezen</span>';
    else badge = '<span class="badge badge-blauw">Nieuw</span>';
    return '<div class="card tekstcard" data-act="open-tekst" data-id="' + t.id + '">' +
      '<h3>' + t.titel + '</h3>' +
      '<div class="meta">' + t.onderwerp + ' · niveau ' + t.niveaubadge + ' · ' + t.woorden.length + ' woorden · ' + t.vragen.length + ' vragen ' + badge + '</div>' +
      '</div>';
  }).join("");
  return '<div class="card">' +
    '<div class="label-boven">Leesvaardigheid</div>' +
    '<h2>Teksten in examenstijl</h2>' +
    '<p class="meta">Elke tekst heeft twee versies: <b>Eenvoudig</b> en <b>2F-examen</b> (Engelse teksten: <b>A2-examen</b>). Begin waar jij wil.</p>' +
    '</div>' + kaarten;
}

function viewLezer() {
  var t = leesKaart();
  if (!t) return viewTeksten();
  var g = geleerd();
  var woordjesRij = t.woorden.map(function (w) {
    var klasse = g.indexOf(w) !== -1 ? "w geleerd" : "w";
    return '<span class="' + klasse + '" data-woord="' + w + '">' + w + '</span>';
  }).join(" · ");
  return '<button class="terug" data-act="naar-teksten">← Alle teksten</button>' +
    '<div class="card">' +
    '<div class="meta">' + t.onderwerp + ' · niveau ' + t.niveaubadge + (t.bron ? ' · ' + t.bron : '') + '</div>' +
    '<div class="laagtabs">' +
    '<button data-act="laag" data-laag="eenvoudig" class="' + (cur.laag === "eenvoudig" ? "actief" : "") + '">Eenvoudig</button>' +
    '<button data-act="laag" data-laag="origineel" class="' + (cur.laag === "origineel" ? "actief" : "") + '">' + (t.taal === "en" ? "A2-examen" : "2F-examen") + '</button>' +
    '</div>' +
    (ttsStatus === "uit" ?
      '<button class="btn btn-soft btn-small" data-act="lees-voor">Voorlezen</button>' :
      '<button class="btn btn-outline btn-small" data-act="tts-stop">Stoppen</button>' +
      '<button class="btn btn-soft btn-small" data-act="tts-pauze">' + (ttsStatus === "pauze" ? "Hervatten" : "Pauzeren") + '</button>') +
    '<div class="tekst">' + tekstNaarHtml(t, cur.laag) + '</div>' +
    '<div class="waarom"><b>Tip:</b> tik op een gemarkeerd woord voor uitleg. Woorden in deze tekst: ' + woordjesRij + '</div>' +
    '<button class="btn btn-primary" data-act="start-quiz" data-id="' + t.id + '">Naar de examenvragen (' + t.vragen.length + ')</button>' +
    '</div>';
}

function viewQuiz() {
  var t = TEKSTEN.find(function (x) { return x.id === quiz.tekstId; });
  if (!t) return viewTeksten();
  if (quiz.i >= t.vragen.length) {
    var pct = Math.round(100 * quiz.goed / t.vragen.length);
    var tekst = pct >= 80 ? "Top. Je bent klaar voor dit examenonderdeel." : pct >= 50 ? "Goed bezig. Oefen de woordjes en probeer opnieuw." : "Lees de tekst nog één keer rustig en probeer daarna opnieuw. Je kunt dit.";
    return '<button class="terug" data-act="open-tekst" data-id="' + t.id + '">← Naar de tekst</button>' +
      '<div class="card" style="text-align:center">' +
      '<div class="label-boven">Resultaat · ' + t.titel + '</div>' +
      '<div class="score-groot">' + quiz.goed + ' / ' + t.vragen.length + '</div>' +
      '<div class="pbalk"><div style="width:' + pct + '%"></div></div>' +
      '<p>' + tekst + '</p>' +
      '<button class="btn btn-primary" data-act="start-quiz" data-id="' + t.id + '">Opnieuw</button>' +
      '<button class="btn btn-green" data-act="start-flash-tekst" data-id="' + t.id + '">Woordjes van deze tekst</button>' +
      '<button class="btn btn-soft" data-act="naar-teksten">Alle teksten</button>' +
      '</div>';
  }
  var vraag = t.vragen[quiz.i];
  var html = '<button class="terug" data-act="open-tekst" data-id="' + t.id + '">← Naar de tekst</button>' +
    '<div class="card">' +
    '<div class="meta">Vraag ' + (quiz.i + 1) + ' van ' + t.vragen.length + ' · ' + t.titel + '</div>' +
    '<div class="vraag"><h3>' + zinMetMarkersNaarHtml(vraag.v) + '</h3>';
  for (var i = 0; i < vraag.opties.length; i++) {
    var cls = "optie";
    var dis = quiz.gekozen !== null ? " disabled" : "";
    if (quiz.gekozen !== null) {
      if (i === vraag.goed) cls += " goed";
      else if (i === quiz.gekozen) cls += " fout";
    }
    html += '<button class="' + cls + '"' + dis + ' data-act="qz-antwoord" data-i="' + i + '">' + zinMetMarkersNaarHtml(vraag.opties[i]) + '</button>';
  }
  if (quiz.gekozen !== null) {
    html += '<div class="waarom"><b>Waarom?</b> ' + zinMetMarkersNaarHtml(vraag.waarom) + '</div>';
    var laatste = quiz.i === t.vragen.length - 1;
    html += '<button class="btn btn-primary" data-act="qz-verder">' + (laatste ? "Bekijk je score" : "Volgende vraag") + '</button>';
  }
  html += '</div></div>';
  return html;
}

function viewWoordjes() {
  var lijst = actieveTeksten();
  var actW = actieveWoorden();
  var opties = lijst.map(function (t) {
    return '<button class="btn btn-soft" data-act="start-flash-tekst" data-id="' + t.id + '">' + t.titel + '</button>';
  }).join("");
  return '<div class="card">' +
    '<div class="label-boven">Woordenschat · ' + filterLabel() + '</div>' +
    '<h2>Woordjes oefenen</h2>' +
    '<p class="meta">Twee manieren: <b>flashcards</b> (woord + uitleg) of een <b>invuloefening</b> (kies het goede woord in de zin).</p>' +
    (actW.length ?
      '<button class="btn btn-green" data-act="start-flash-alle">Alle woorden — flashcards</button>' +
      '<button class="btn btn-accent" data-act="start-invul-alle">Alle woorden — invuloefening</button>' : '') +
    '</div>' +
    (lijst.length ? '<div class="card"><h3>Woordjes per tekst</h3>' + opties + '</div>' : legeKeuzeKaart("woordjes"));
}

function viewTrainer() {
  if (trainer.pool.length === 0) {
    return '<div class="card"><h2>Klaar</h2><p>Je hebt alle woordjes in deze ronde gezien.</p>' +
      '<button class="btn btn-primary" data-act="nog-een-ronde">Nog een keer</button></div>';
  }
  if (trainer.i >= trainer.pool.length) {
    var pct = trainer.pool.length ? Math.round(100 * trainer.goed / trainer.pool.length) : 100;
    return '<div class="card" style="text-align:center">' +
      '<div class="label-boven">Ronde voltooid</div>' +
      '<div class="score-groot">' + trainer.goed + ' / ' + trainer.pool.length + '</div>' +
      '<div class="pbalk"><div style="width:' + pct + '%"></div></div>' +
      '<p class="meta">Elke dag een rondje = sterke woordenschat voor het examen.</p>' +
      '<button class="btn btn-primary" data-act="nog-een-ronde">Nog een ronde</button>' +
      '<button class="btn btn-soft" data-act="naar-woordjes">Terug naar woordjes</button>' +
      '</div>';
  }
  var w = trainer.pool[trainer.i];
  var info = WOORDEN[w];
  var actW = actieveWoorden();
  var g = geleerd().filter(function (x) { return actW.indexOf(x) !== -1; }).length;
  var voortgangRegel = '<div class="meta" style="text-align:center;margin-bottom:10px">Woord ' + (trainer.i + 1) + ' van ' + trainer.pool.length + ' · geleerd: ' + g + ' van ' + (actW.length || trainer.pool.length) + '</div>';

  if (trainer.mode === "flash") {
    var binnen = trainer.flipped ?
      '<div class="flash">' +
      '<div class="groot">' + w + '</div>' +
      '<div class="uitleg">' + info.u + '</div>' +
      '<div class="vb">' + info.v + '</div>' +
      '</div>' :
      '<div class="flash" style="cursor:pointer" data-act="flip">' +
      '<div class="groot">' + w + '</div>' +
      '<div class="uitleg" style="opacity:.7">Tik op de kaart voor de uitleg</div>' +
      '</div>';
    return '<button class="terug" data-act="naar-woordjes">← Woordjes</button>' + voortgangRegel + binnen +
      (trainer.flipped ?
        '<button class="btn btn-green" data-act="flash-wist">Wist ik het</button>' +
        '<button class="btn btn-outline" data-act="flash-nog">Nog niet</button>' :
        '<button class="btn btn-soft btn-small" data-act="woord-luister" data-w="' + w + '">' + (ttsStatus === "uit" ? "Voorlezen" : "Stoppen") + '</button>');
  }

  /* invulmodus */
  var zin = info.v;
  function maakRe(p) { return new RegExp(p.replace(/[.*+?^${}()|[\]\\]/g, "\\" + "$" + "&"), "i"); }
  function probeer(p) { var z = zin.replace(maakRe(p), "___"); return z === zin ? null : z; }
  var vervang = probeer(w) || probeer(w.split(" ")[0]) || probeer(w.split(" ")[w.split(" ").length - 1]) || ("___ " + zin);
  var optiesHtml = trainer.opties.map(function (o, idx) {
    var cls = "optie";
    var dis = trainer.gekozen !== null ? " disabled" : "";
    if (trainer.gekozen !== null) {
      if (o === trainer.gevraagd) cls += " goed";
      else if (idx === trainer.gekozen) cls += " fout";
    }
    return '<button class="' + cls + '"' + dis + ' data-act="invul-antwoord" data-i="' + idx + '">' + o + '</button>';
  }).join("");
  var feedback = "";
  if (trainer.gekozen !== null) {
    var ok = trainer.opties[trainer.gekozen] === trainer.gevraagd;
    feedback = '<div class="waarom">' + (ok ? "<b>Goed.</b>" : "<b>Niet goed.</b> Het goede antwoord is <b>" + trainer.gevraagd + "</b>.") +
      ' ' + info.u + '<br>' + info.v + '</div>' +
      '<button class="btn btn-primary" data-act="invul-verder">Volgende</button>';
  }
  return '<button class="terug" data-act="naar-woordjes">← Woordjes</button>' + voortgangRegel +
    '<div class="invulzin">' + vervang.replace(/___/g, '<span class="blank">?</span>') + '</div>' +
    optiesHtml + feedback;
}

function viewSchrijven() {
  var swk = schrijfOpslag();
  var lijst = actieveSchrijf();
  if (!lijst.length) return legeKeuzeKaart("schrijfopdrachten");
  var kaarten = lijst.map(function (o) {
    var rec = swk[o.id];
    var badge = rec && rec.afgerond ? '<span class="badge">Afgerond</span>' : (rec && rec.tekst ? '<span class="badge badge-blauw">Bezig</span>' : '<span class="badge badge-blauw">Nieuw</span>');
    return '<div class="card tekstcard" data-act="sw-open" data-id="' + o.id + '">' +
      '<h3>' + o.titel + '</h3>' +
      '<div class="meta">' + o.soort + ' · min. ' + o.minWoorden + ' woorden ' + badge + '</div>' +
      '</div>';
  }).join("");
  return '<div class="card">' +
    '<div class="label-boven">Schrijfvaardigheid</div>' +
    '<h2>Schrijfopdrachten</h2>' +
    '<p class="meta">Oefen het echte examenformaat: een e-mail of bericht met aanhef, duidelijke punten en een nette groet. Je bouwt je tekst op in vijf stappen en checkt jezelf met de exameneisen.</p>' +
    '</div>' + kaarten +
    '<div class="card"><p class="meta">Je tekst blijft op dit toestel en wordt automatisch bewaard. Je kunt later altijd verdergaan.</p></div>';
}

function viewSchrijf() {
  var o = swOpdracht();
  if (!o) return viewSchrijven();
  var opgeslagen = schrijfOpslag()[o.id] || {};
  var afgerond = opgeslagen.afgerond || false;

  var stappen = ["Situatie", "Woordweb", "Zinnen bouwen", "Schrijven", "Zelfcheck"];
  var balk = '<div class="stapbalk">' + stappen.map(function (s, i) {
    return '<span class="' + (i < sw.stap ? "aan" : "") + '"></span>';
  }).join("") + '</div>';
  var kop = '<button class="terug" data-act="naar-schrijven">← Schrijfopdrachten</button>' +
    '<div class="card">' +
    '<div class="label-boven">' + o.soort + '</div>' +
    '<h2>' + o.titel + '</h2>' +
    balk;

  /* ---- stap 1: situatie ---- */
  if (sw.stap === 1) {
    var taakLijst = '<ol style="margin:8px 0 14px;padding-left:20px">' + o.taak.map(function (p) { return "<li>" + p + "</li>"; }).join("") + '</ol>';
    return kop + '<p>' + o.situatie + '</p>' +
      '<div class="waarom"><b>Dit moet in je tekst staan (exameneisen):</b></div>' + taakLijst +
      '<p class="meta">Minimum: ' + o.minWoorden + ' woorden. Neem de tijd — je kunt later verdergaan.</p>' +
      '<button class="btn btn-primary" data-act="sw-stap" data-n="2">Volgende: woordweb</button>' +
      '</div>';
  }

  /* ---- stap 2: woordweb ---- */
  if (sw.stap === 2) {
    var chips = o.woordweb.map(function (w) {
      var aan = sw.woorden.indexOf(w) !== -1;
      return '<span class="chip ' + (aan ? "chip-aan" : "") + '" data-act="sw-woord" data-w="' + w + '">' + w + '</span>';
    }).join("");
    return kop + '<div class="stapnr"><b>2</b><span><b>Woordweb</b> — tik op woorden die je wilt gebruiken</span></div>' +
      '<p class="meta">Kies woorden die bij jouw tekst passen. Ze verschijnen in je notities bij het schrijven.</p>' +
      chips +
      '<div style="height:10px"></div>' +
      '<button class="btn btn-soft" data-act="sw-stap" data-n="1">Vorige</button>' +
      '<button class="btn btn-primary" data-act="sw-stap" data-n="3">Volgende: zinnen bouwen</button>' +
      '</div>';
  }

  /* ---- stap 3: starters ---- */
  if (sw.stap === 3) {
    var schips = o.starters.map(function (s) {
      var aan = sw.starters.indexOf(s) !== -1;
      return '<span class="chip ' + (aan ? "chip-aan" : "") + '" data-act="sw-starter" data-s="' + s.replace(/"/g, "&quot;") + '">' + s + '</span>';
    }).join("");
    var notitie = (sw.starters.length ? sw.starters.join("\n") + "\n" : "") + (sw.woorden.length ? "\nWoorden die ik ga gebruiken: " + sw.woorden.join(", ") : "");
    return kop + '<div class="stapnr"><b>3</b><span><b>Zinnen bouwen</b> — tik op startzinnen</span></div>' +
      '<p class="meta">Dit zijn zinnen zoals op het examen. Tik ze aan: ze komen klaar te staan in de schrijftekst.</p>' +
      schips +
      (notitie.trim() ? '<div class="label-boven" style="margin-top:12px">Mijn notities</div><div class="startersnotitie">' + notitie + '</div>' : '') +
      '<button class="btn btn-soft" data-act="sw-stap" data-n="2">Vorige</button>' +
      '<button class="btn btn-primary" data-act="sw-stap" data-n="4">Volgende: schrijven</button>' +
      '</div>';
  }

  /* ---- stap 4: schrijven ---- */
  if (sw.stap === 4) {
    var n = aantalWoorden(sw.tekst);
    var volgend = "";
    if (afgerond) {
      volgend = '<button class="btn btn-green" data-act="sw-stap" data-n="5">Naar de zelfcheck</button>';
    } else {
      volgend = '<button class="btn btn-primary" data-act="sw-stap" data-n="5" ' + (n < o.minWoorden ? "disabled" : "") + '>Volgende: zelfcheck</button>';
    }
    return kop + '<div class="stapnr"><b>4</b><span><b>Schrijven</b> — jouw tekst</span></div>' +
      '<p class="meta">Schrijf je e-mail of bericht hieronder. Gebruik je notities hierboven. De tekst wordt bewaard op dit toestel.</p>' +
      '<textarea id="swTekst" placeholder="Beste ...">' + (sw.tekst ? sw.tekst.replace(/</g, "&lt;") : "") + '</textarea>' +
      '<div class="meta" id="woordteller" style="text-align:right;margin-top:6px">' + n + ' woorden (min. ' + o.minWoorden + ')</div>' +
      '<button class="btn btn-soft" data-act="sw-stap" data-n="3">Vorige</button>' +
      volgend +
      '</div>';
  }

  /* ---- stap 5: zelfcheck ---- */
  var checks = o.checklist.map(function (c, i) {
    var aan = sw.checks.indexOf(i) !== -1;
    return '<button class="checkitem ' + (aan ? "aan" : "") + '" data-act="sw-check" data-i="' + i + '"><span class="checkbox"></span><span>' + c + '</span></button>';
  }).join("");
  var n2 = aantalWoorden(sw.tekst);
  var allesAan = sw.checks.length === o.checklist.length && n2 >= o.minWoorden;
  var jouwTekst = sw.toonJouwTekst || afgerond;
  var onder = "";
  if (jouwTekst) {
    onder += '<div class="label-boven" style="margin-top:14px">Jouw tekst</div><div class="voorbeeldtekst">' + (sw.tekst ? sw.tekst.replace(/</g, "&lt;") : "— nog leeg —") + '</div>';
  }
  if (sw.toonVoorbeeld || afgerond) {
    onder += '<div class="label-boven" style="margin-top:14px">Voorbeeld van een goed antwoord</div><div class="voorbeeldtekst">' + o.voorbeeld + '</div>' +
      '<p class="meta" style="margin-top:8px">Vergelijk: wat doet het voorbeeld goed? Wat kun jij de volgende keer verbeteren?</p>';
  }
  var knoppen = '';
  if (!afgerond) {
    knoppen = '<button class="btn btn-green" data-act="sw-rondaf" ' + (allesAan ? "" : "disabled") + '>Alles gecheckt: afronden</button>' +
      '<div class="sheetknoppen" style="margin-top:4px">' +
      '<button class="btn btn-soft btn-small" data-act="sw-voorbeeld">Voorbeeld bekijken</button>' +
      '<button class="btn btn-soft btn-small" data-act="sw-mijntekst">Mijn tekst bekijken</button>' +
      '</div>';
  } else {
    knoppen = '<p class="badge" style="display:inline-block;margin-bottom:12px">Afgerond</p>' +
      '<div class="sheetknoppen">' +
      '<button class="btn btn-soft btn-small" data-act="sw-voorbeeld">Voorbeeld</button>' +
      '<button class="btn btn-soft btn-small" data-act="sw-mijntekst">Mijn tekst</button>' +
      '<button class="btn btn-outline btn-small" data-act="sw-opnieuw">Opnieuw beginnen</button>' +
      '</div>';
  }
  return kop + '<div class="stapnr"><b>5</b><span><b>Zelfcheck</b> — controleer je tekst met de exameneisen</span></div>' +
      '<p class="meta">Tik elk punt aan dat klopt voor jouw tekst (' + n2 + ' woorden, min. ' + o.minWoorden + ').</p>' +
      checks + knoppen + onder +
      '<button class="btn btn-soft" data-act="sw-stap" data-n="4">Vorige: schrijven</button>' +
      '</div>';
}

function viewVoortgang() {
  var g = geleerd();
  var actW = actieveWoorden();
  var totaal = actW.length;
  var pct = totaal ? Math.round(100 * g.filter(function (w) { return actW.indexOf(w) !== -1; }).length / totaal) : 0;
  var st = store("streak", { count: 0 });
  var sc = scores();
  var swk = schrijfOpslag();
  var lijst = actieveTeksten();
  var scHtml = lijst.map(function (t) {
    var status = sc[t.id] ? "Vragen: <b>" + sc[t.id] + "</b>" : (gelezen().indexOf(t.id) !== -1 ? "Gelezen, vragen nog open" : "Nog niet begonnen");
    return '<div class="card"><h3>' + t.titel + '</h3><div class="meta">' + status + ' · ' + t.woorden.length + ' woorden</div></div>';
  }).join("");
  var swLijst = actieveSchrijf();
  var swHtml = swLijst.map(function (o) {
    var rec = swk[o.id];
    var status = rec && rec.afgerond ? "Afgerond" : (rec && rec.tekst ? "Bezig (" + aantalWoorden(rec.tekst) + " woorden)" : "Nog niet begonnen");
    return '<div class="card"><h3>' + o.titel + '</h3><div class="meta">' + o.soort + ' · ' + status + '</div></div>';
  }).join("");
  var motivatie = pct >= 80 ? "Bijna alle woorden onder de knie." : pct >= 40 ? "Goed bezig. Elke dag een klein stukje." : "Begin vandaag: vijf minuten woordjes maakt al verschil.";
  return '<div class="card">' +
    '<div class="label-boven">Voortgang · ' + filterLabel() + '</div>' +
    '<div class="stats">' +
    '<div class="stat"><b>' + st.count + '</b><small>dagen streak</small></div>' +
    '<div class="stat"><b>' + (totaal ? g.filter(function (w) { return actW.indexOf(w) !== -1; }).length : 0) + '/' + totaal + '</b><small>woorden geleerd</small></div>' +
    '</div>' +
    '<div class="pbalk"><div style="width:' + pct + '%"></div></div>' +
    '<p class="meta">' + motivatie + '</p>' +
    '</div>' +
    (swLijst.length ? '<div class="card"><h3 style="font-size:16px;margin:0 0 8px">Schrijfopdrachten</h3>' + swHtml.replace(/class="card"/g, 'class="card" style="margin-bottom:8px;padding:12px 14px"') + '</div>' : '') +
    (scHtml || legeKeuzeKaart("teksten")) +
    '<div class="card">' +
    '<button class="btn btn-outline" data-act="reset">Alles wissen</button>' +
    '<p class="meta">Je voortgang en teksten staan alleen op dit toestel. Alles wissen kan niet terug gedraaid worden.</p>' +
    '</div>';
}

/* ---------- events ---------- */
document.getElementById("app").addEventListener("click", function (e) {
  var woordEl = e.target.closest("[data-woord]");
  if (woordEl && !woordEl.hasAttribute("data-act")) { openWoord(woordEl.getAttribute("data-woord")); return; }

  var el = e.target.closest("[data-act]");
  if (!el) return;
  var act = el.getAttribute("data-act");
  var id = el.getAttribute("data-id");

  if (act === "open-tekst") openTekst(id);
  else if (act === "open-eerste-tekst") {
    var lijst = actieveTeksten();
    if (!lijst.length) { toast("Nog geen teksten voor deze keuze. Kies bovenin een ander vak."); return; }
    var nogNiet = lijst.filter(function (t) { return gelezen().indexOf(t.id) === -1; });
    openTekst(nogNiet.length ? nogNiet[0].id : lijst[0].id);
  }
  else if (act === "open-schrijf-eerste") {
    var swk = schrijfOpslag();
    var lijst2 = actieveSchrijf();
    if (!lijst2.length) { toast("Nog geen schrijfopdrachten voor deze keuze."); return; }
    var openstaand = lijst2.filter(function (o) { return !(swk[o.id] && swk[o.id].afgerond); });
    openSchrijf(openstaand.length ? openstaand[0].id : lijst2[0].id);
  }
  else if (act === "laag") { ttsCancel(); cur.laag = el.getAttribute("data-laag"); render(); }
  else if (act === "lees-voor") {
    var lt = leesKaart();
    if (lt) leesVoor(plainText(lt[cur.laag]), lt.taal === "en" ? "en" : "nl");
  }
  else if (act === "tts-stop") stopVoorlezen();
  else if (act === "tts-pauze") { if (ttsStatus === "pauze") hervatVoorlezen(); else pauzeerVoorlezen(); }
  else if (act === "woord-luister") {
    if (ttsStatus !== "uit") stopVoorlezen();
    else leesWoordVoor(el.getAttribute("data-w"));
  }
  else if (act === "start-quiz") startQuiz(id);
  else if (act === "naar-teksten") ga("teksten");
  else if (act === "naar-woordjes") ga("woordjes");
  else if (act === "naar-schrijven") ga("schrijven");
  else if (act === "naar-voortgang") ga("voortgang");
  else if (act === "start-flash-alle") startTrainer("flash", "alle");
  else if (act === "start-flash-tekst") startTrainer("flash", id);
  else if (act === "start-invul-alle") startTrainer("invul", "alle");
  else if (act === "flip") { trainer.flipped = true; render(); }
  else if (act === "flash-wist") {
    addGeleerd(trainer.pool[trainer.i]);
    touchStreak();
    trainer.i++; trainer.flipped = false;
    toast("Woord geleerd");
    render();
  }
  else if (act === "flash-nog") { touchStreak(); trainer.i++; trainer.flipped = false; render(); }
  else if (act === "invul-antwoord") {
    if (trainer.gekozen === null) {
      trainer.gekozen = parseInt(el.getAttribute("data-i"), 10);
      if (trainer.opties[trainer.gekozen] === trainer.gevraagd) { trainer.goed++; addGeleerd(trainer.gevraagd); }
      touchStreak();
      render();
    }
  }
  else if (act === "invul-verder") { trainer.i++; trainer.gekozen = null; maakInvulVraag(); render(); }
  else if (act === "nog-een-ronde") startTrainer(trainer.mode, trainer.scope);
  else if (act === "qz-antwoord") {
    if (quiz.gekozen === null) {
      quiz.gekozen = parseInt(el.getAttribute("data-i"), 10);
      var qt = TEKSTEN.find(function (x) { return x.id === quiz.tekstId; });
      if (quiz.gekozen === qt.vragen[quiz.i].goed) { quiz.goed++; touchStreak(); }
      render();
    }
  }
  else if (act === "qz-verder") {
    var t2 = TEKSTEN.find(function (x) { return x.id === quiz.tekstId; });
    if (quiz.i === t2.vragen.length - 1) {
      var sc = scores();
      sc[quiz.tekstId] = quiz.goed + "/" + t2.vragen.length;
      set("scores", sc);
    }
    quiz.i++;
    quiz.gekozen = null;
    render();
    window.scrollTo(0, 0);
  }
  /* --- schrijfvaardigheid --- */
  else if (act === "sw-open") openSchrijf(id);
  else if (act === "sw-stap") swStap(parseInt(el.getAttribute("data-n"), 10));
  else if (act === "sw-woord") {
    var w = el.getAttribute("data-w");
    var pos = sw.woorden.indexOf(w);
    if (pos === -1) { sw.woorden.push(w); } else { sw.woorden.splice(pos, 1); }
    render();
  }
  else if (act === "sw-starter") {
    var s = el.getAttribute("data-s");
    var pos2 = sw.starters.indexOf(s);
    if (pos2 === -1) { sw.starters.push(s); } else { sw.starters.splice(pos2, 1); }
    render();
  }
  else if (act === "sw-check") {
    var ci = parseInt(el.getAttribute("data-i"), 10);
    var pos3 = sw.checks.indexOf(ci);
    if (pos3 === -1) { sw.checks.push(ci); } else { sw.checks.splice(pos3, 1); }
    render();
  }
  else if (act === "sw-rondaf") swRondAf();
  else if (act === "sw-voorbeeld") { sw.toonVoorbeeld = true; render(); }
  else if (act === "sw-mijntekst") { sw.toonJouwTekst = true; render(); }
  else if (act === "sw-opnieuw") {
    sw.tekst = ""; sw.checks = []; sw.starters = []; sw.woorden = []; sw.stap = 1; sw.toonVoorbeeld = false; sw.toonJouwTekst = false;
    var swk2 = schrijfOpslag();
    if (swk2[sw.id]) { swk2[sw.id] = { tekst: "", afgerond: false }; set("schrijf", swk2); }
    render();
  }
  else if (act === "reset") {
    if (confirm("Alles wissen? Je woorden, scores, schrijfteksten en streak verdwijnen van dit toestel.")) {
      ["geleerd", "gelezen", "scores", "streak", "schrijf"].forEach(function (k) { try { localStorage.removeItem("em2f_" + k); } catch (e) {} });
      render();
    }
  }
});

/* live woordenteller + bewaren tijdens het typen */
document.getElementById("app").addEventListener("input", function (e) {
  if (e.target && e.target.id === "swTekst") {
    sw.tekst = e.target.value;
    var n = aantalWoorden(sw.tekst);
    var teller = document.getElementById("woordteller");
    if (teller) { teller.textContent = n + " woorden (min. " + (swOpdracht() ? swOpdracht().minWoorden : 0) + ")"; }
  }
});
document.getElementById("app").addEventListener("blur", function (e) {
  if (e.target && e.target.id === "swTekst" && view === "schrijf") { swBewaarTekst(); }
}, true);

document.getElementById("sheetBack").addEventListener("click", sluitWoord);

document.getElementById("sheet").addEventListener("click", function (e) {
  var el = e.target.closest("[data-act]");
  if (!el) return;
  var act = el.getAttribute("data-act");
  var w = el.getAttribute("data-w");
  if (act === "woord-luister") {
    if (ttsStatus !== "uit") ttsCancel();
    else leesWoordVoor(w);
  } else if (act === "woord-geleerd") {
    addGeleerd(w);
    touchStreak();
    toast("Toegevoegd aan je woordjes");
    sluitWoord();
  } else if (act === "woord-close") {
    sluitWoord();
  }
});

document.querySelectorAll("#nav button").forEach(function (b) {
  b.addEventListener("click", function () { ga(b.getAttribute("data-nav")); });
});

document.getElementById("selLeerweg").value = filter.leerweg;
document.getElementById("selVak").value = filter.vak;
document.getElementById("selLeerweg").addEventListener("change", function () {
  setFilter({ leerweg: this.value, vak: filter.vak });
});
document.getElementById("selVak").addEventListener("change", function () {
  setFilter({ leerweg: filter.leerweg, vak: this.value });
});

/* ---------- start ---------- */
touchStreak();
render();
</script>
