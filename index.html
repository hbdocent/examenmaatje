</style>
</head>

/* ---------- opslag (alleen op dit toestel) ---------- */
function store(k, d) {
  try { var v = localStorage.getItem("em2f_" + k); return v ? JSON.parse(v) : d; }
  catch (e) { return d; }
}
function set(k, v) { try { localStorage.setItem("em2f_" + k, JSON.stringify(v)); } catch (e) {} }
function geleerd() { return store("geleerd", []); }
function addGeleerd(w) {
  var g = geleerd();
  if (g.indexOf(w) === -1) { g.push(w); set("geleerd", g); }
}
function gelezen() { return store("gelezen", []); }
function addGelezen(id) {
  var g = gelezen();
  if (g.indexOf(id) === -1) { g.push(id); set("gelezen", g); }
}
function scores() { return store("scores", {}); }
function schrijfOpslag() { return store("schrijf", {}); }
function alleWoorden() {
  var alle = [];
  TEKSTEN.forEach(function (t) { alle = alle.concat(t.woorden); });
  return alle;
}

/* ---------- streak ---------- */
function dagString(d) {
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function touchStreak() {
  var nu = new Date();
  var vandaag = dagString(nu);
  var gisteren = new Date(nu.getTime() - 86400000);
  var st = store("streak", { last: "", count: 0 });
  if (st.last === vandaag) return;
  st.count = (st.last === dagString(gisteren)) ? st.count + 1 : 1;
  st.last = vandaag;
  set("streak", st);
}
function updateStreakBadge() {
  var st = store("streak", { last: "", count: 0 });
  document.getElementById("streakBadge").textContent = st.count + (st.count === 1 ? " dag" : " dagen");
}

/* ---------- voorlezen (Web Speech API, gratis, ingebouwd) ---------- */
function leesVoor(tekst) {
  if (!("speechSynthesis" in window)) { alert("Voorlezen werkt niet in deze browser."); return; }
  var u = new SpeechSynthesisUtterance(tekst);
  u.lang = "nl-NL";
  u.rate = 0.95;
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}
function plainText(zin) {
  return zin.replace(/\[\[([^\]|]+)(?:\|[^\]]+)?\]\]/g, "$1");
}
function zinMetMarkersNaarHtml(zin) {
  var esc = zin.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  return esc.replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g, function (m, w, disp) {
    var naam = w;
    var show = disp || w;
    var klasse = geleerd().indexOf(naam) !== -1 ? "w geleerd" : "w";
    return '<span class="' + klasse + '" data-woord="' + naam.replace(/"/g, "&quot;") + '">' + show + "</span>";
  });
}
function tekstNaarHtml(t, laag) {
  return t[laag].split("\n").filter(function (p) { return p.trim() !== ""; })
    .map(function (p, i) { return (i === 0 ? "<h2>" : "<p>") + zinMetMarkersNaarHtml(p) + (i === 0 ? "</h2>" : "</p>"); })
    .join("");
}

/* ---------- toast ---------- */

  var el = document.getElementById("toast");

  el.style.display = "block";

}

function shuffle(a) {
  var arr = a.slice();
  for (var i = arr.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
  }
  return arr;
}
function startTrainer(mode, scope) {
  var pool = [];
  if (scope === "alle") { pool = shuffle(alleWoorden()); }
  else {
    var t = TEKSTEN.find(function (x) { return x.id === scope; });
    pool = t ? shuffle(t.woorden) : shuffle(alleWoorden());
  }
  trainer = { mode: mode, scope: scope, pool: pool, i: 0, goed: 0, flipped: false, gekozen: null, opties: [], gevraagd: null };
  if (mode === "invul") maakInvulVraag();
  view = "trainer";
  render();
  window.scrollTo(0, 0);
}
function maakInvulVraag() {
  if (trainer.i >= trainer.pool.length) { trainer.opties = []; return; }
  var w = trainer.pool[trainer.i];
  var af = trainer.pool.filter(function (x) { return x !== w; });
  var distr = shuffle(af).slice(0, 3);
  trainer.opties = shuffle([w].concat(distr));
  trainer.gevraagd = w;
}

function swStap(n) {

  opgeslagen[sw.id] = rec;
  set("schrijf", opgeslagen);
  touchStreak();
}

  touchStreak();
  toast("Opdracht afgerond. Goed gedaan.");
  sw.stap = 5;
  sw.toonJouwTekst = true;
  render();
}
function aantalWoorden(t) {
  if (!t || !t.trim()) return 0;
  return t.trim().split(/\s+/).filter(Boolean).length;
}

/* ---------- woorden-popup ---------- */
function openWoord(w) {
  var info = WOORDEN[w];
  if (!info) return;
  var isGeleerd = geleerd().indexOf(w) !== -1;
  var sheet = document.getElementById("sheet");
  var back = document.getElementById("sheetBack");
  sheet.innerHTML =
    '<h3>' + w + '</h3>' +
    '<div class="soort">' + info.s + '</div>' +
    '<div class="uitleg-regel">' + info.u + '</div>' +
    '<div class="voorbeeld">' + info.v + '</div>' +
    '<div class="sheetknoppen">' +
    '<button class="btn btn-soft btn-small" data-act="woord-luister" data-w="' + w + '">Voorlezen</button>' +
    '<button class="btn btn-green btn-small" data-act="woord-geleerd" data-w="' + w + '">' + (isGeleerd ? "In je lijst" : "Geleerd") + '</button>' +
    '<button class="btn btn-outline btn-small" data-act="woord-close">Sluiten</button>' +
    '</div>';
  sheet.hidden = false;
  back.hidden = false;
}
function sluitWoord() {
  document.getElementById("sheet").hidden = true;
  document.getElementById("sheetBack").hidden = true;
  if (view === "lezer") render();
}

/* ---------- views ---------- */
function render() {
  var app = document.getElementById("app");
  var html = "";
  if (view === "home") html = viewHome();
  else if (view === "teksten") html = viewTeksten();
  else if (view === "lezer") html = viewLezer();
  else if (view === "quiz") html = viewQuiz();
  else if (view === "woordjes") html = viewWoordjes();
  else if (view === "trainer") html = viewTrainer();
  else if (view === "schrijven") html = viewSchrijven();
  else if (view === "schrijf") html = viewSchrijf();
  else if (view === "voortgang") html = viewVoortgang();
  app.innerHTML = html;

  var navMap = { home: "home", teksten: "teksten", lezer: "teksten", quiz: "teksten", woordjes: "woordjes", trainer: "woordjes", schrijven: "schrijven", schrijf: "schrijven", voortgang: "voortgang" };
  var buttons = document.querySelectorAll("#nav button");
  for (var i = 0; i < buttons.length; i++) {
    buttons[i].classList.toggle("actief", buttons[i].getAttribute("data-nav") === navMap[view]);
  }
  updateStreakBadge();
}

function viewHome() {
  var g = geleerd().length;
  var st = store("streak", { count: 0 });
  var swk = schrijfOpslag();
  var swKlaar = SCHRIJF.filter(function (o) { return swk[o.id] && swk[o.id].afgerond; }).length;
  return '' +
    '<div class="card hero">' +
    '<div class="label-boven">Examen Nederlands · 2F</div>' +
    '<h1>Oefenen op jouw tempo</h1>' +
    '<p class="sub">Korte sessies: een tekst lezen, woordjes doen of een schrijfopdracht maken. Alles blijft op dit toestel.</p>' +
    '<div class="stats">' +
    '<div class="stat"><b>' + st.count + '</b><small>dagen streak</small></div>' +
    '<div class="stat"><b>' + g + '</b><small>woorden geleerd</small></div>' +
    '<div class="stat"><b>' + swKlaar + '/' + SCHRIJF.length + '</b><small>schrijfopdrachten</small></div>' +
    '</div>' +
    '<button class="btn btn-primary" data-act="open-eerste-tekst">Tekst lezen</button>' +
    '<button class="btn btn-accent" data-act="start-flash-alle">Woordjes oefenen (5 min)</button>' +
    '<button class="btn btn-outline" data-act="open-schrijf-eerste">Schrijfopdracht maken</button>' +
    '<details class="hoe"><summary>Hoe werkt ExamenMaatje?</summary><ol>' +
    '<li><b>Lees een tekst</b> in twee versies: Eenvoudig en 2F-examen. Tik op een gemarkeerd woord voor uitleg.</li>' +
    '<li><b>Doe de examenvragen</b> in echte examenstijl, met uitleg waarom iets goed of fout is.</li>' +
    '<li><b>Maak een schrijfopdracht</b> in vijf stappen, net als op het examen: van woordweb tot zelfcheck.</li>' +
    '<li><b>Oefen je woordjes</b> elke dag vijf minuten. Kleine sessies, groot effect.</li>' +
    '</ol></details>' +
    '</div>';
}

function viewTeksten() {
  var sc = scores();
  var g = gelezen();
  var kaarten = TEKSTEN.map(function (t) {
    var badge = "";
    if (sc[t.id]) badge = '<span class="badge">Vragen: ' + sc[t.id] + '</span>';
    else if (g.indexOf(t.id) !== -1) badge = '<span class="badge badge-blauw">Gelezen</span>';
    else badge = '<span class="badge badge-blauw">Nieuw</span>';
    return '<div class="card tekstcard" data-act="open-tekst" data-id="' + t.id + '">' +
      '<h3>' + t.titel + '</h3>' +
      '<div class="meta">' + t.onderwerp + ' · niveau ' + t.niveaubadge + ' · ' + t.woorden.length + ' woorden · ' + t.vragen.length + ' vragen ' + badge + '</div>' +
      '</div>';
  }).join("");
  return '<div class="card">' +
    '<div class="label-boven">Leesvaardigheid</div>' +
    '<h2>Teksten in examenstijl</h2>' +
    '<p class="meta">Elke tekst heeft twee versies: <b>Eenvoudig</b> en <b>2F-examen</b> (zoals op het echte examen). Begin waar jij wil.</p>' +
    '</div>' + kaarten;
}

function viewLezer() {
  var t = leesKaart();
  if (!t) return viewTeksten();
  var g = geleerd();
  var woordjesRij = t.woorden.map(function (w) {
    var klasse = g.indexOf(w) !== -1 ? "w geleerd" : "w";
    return '<span class="' + klasse + '" data-woord="' + w + '">' + w + '</span>';
  }).join(" · ");
  return '<button class="terug" data-act="naar-teksten">← Alle teksten</button>' +
    '<div class="card">' +
    '<div class="meta">' + t.onderwerp + ' · niveau ' + t.niveaubadge + (t.bron ? ' · ' + t.bron : '') + '</div>' +
    '<div class="laagtabs">' +
    '<button data-act="laag" data-laag="eenvoudig" class="' + (cur.laag === "eenvoudig" ? "actief" : "") + '">Eenvoudig</button>' +
    '<button data-act="laag" data-laag="origineel" class="' + (cur.laag === "origineel" ? "actief" : "") + '">2F-examen</button>' +
    '</div>' +
    '<button class="btn btn-soft btn-small" data-act="lees-voor">Voorlezen</button>' +
    '<div class="tekst">' + tekstNaarHtml(t, cur.laag) + '</div>' +
    '<div class="waarom"><b>Tip:</b> tik op een gemarkeerd woord voor uitleg. Woorden in deze tekst: ' + woordjesRij + '</div>' +
    '<button class="btn btn-primary" data-act="start-quiz" data-id="' + t.id + '">Naar de examenvragen (' + t.vragen.length + ')</button>' +
    '</div>';
}

function viewQuiz() {
  var t = TEKSTEN.find(function (x) { return x.id === quiz.tekstId; });
  if (!t) return viewTeksten();
  if (quiz.i >= t.vragen.length) {
    var pct = Math.round(100 * quiz.goed / t.vragen.length);
    var tekst = pct >= 80 ? "Top. Je bent klaar voor dit examenonderdeel." : pct >= 50 ? "Goed bezig. Oefen de woordjes en probeer opnieuw." : "Lees de tekst nog één keer rustig en probeer daarna opnieuw. Je kunt dit.";
    return '<button class="terug" data-act="open-tekst" data-id="' + t.id + '">← Naar de tekst</button>' +
      '<div class="card" style="text-align:center">' +
      '<div class="label-boven">Resultaat · ' + t.titel + '</div>' +
      '<div class="score-groot">' + quiz.goed + ' / ' + t.vragen.length + '</div>' +
      '<div class="pbalk"><div style="width:' + pct + '%"></div></div>' +
      '<p>' + tekst + '</p>' +
      '<button class="btn btn-primary" data-act="start-quiz" data-id="' + t.id + '">Opnieuw</button>' +
      '<button class="btn btn-green" data-act="start-flash-tekst" data-id="' + t.id + '">Woordjes van deze tekst</button>' +
      '<button class="btn btn-soft" data-act="naar-teksten">Alle teksten</button>' +
      '</div>';
  }
  var vraag = t.vragen[quiz.i];
  var html = '<button class="terug" data-act="open-tekst" data-id="' + t.id + '">← Naar de tekst</button>' +
    '<div class="card">' +
    '<div class="meta">Vraag ' + (quiz.i + 1) + ' van ' + t.vragen.length + ' · ' + t.titel + '</div>' +
    '<div class="vraag"><h3>' + zinMetMarkersNaarHtml(vraag.v) + '</h3>';
  for (var i = 0; i < vraag.opties.length; i++) {
    var cls = "optie";
    var dis = quiz.gekozen !== null ? " disabled" : "";
    if (quiz.gekozen !== null) {
      if (i === vraag.goed) cls += " goed";
      else if (i === quiz.gekozen) cls += " fout";
    }
    html += '<button class="' + cls + '"' + dis + ' data-act="qz-antwoord" data-i="' + i + '">' + zinMetMarkersNaarHtml(vraag.opties[i]) + '</button>';
  }
  if (quiz.gekozen !== null) {
    html += '<div class="waarom"><b>Waarom?</b> ' + zinMetMarkersNaarHtml(vraag.waarom) + '</div>';
    var laatste = quiz.i === t.vragen.length - 1;
    html += '<button class="btn btn-primary" data-act="qz-verder">' + (laatste ? "Bekijk je score" : "Volgende vraag") + '</button>';
  }
  html += '</div></div>';
  return html;
}

function viewWoordjes() {
  var opties = TEKSTEN.map(function (t) {
    return '<button class="btn btn-soft" data-act="start-flash-tekst" data-id="' + t.id + '">' + t.titel + '</button>';
  }).join("");
  return '<div class="card">' +
    '<div class="label-boven">Woordenschat</div>' +
    '<h2>Woordjes oefenen</h2>' +
    '<p class="meta">Twee manieren: <b>flashcards</b> (woord + uitleg) of een <b>invuloefening</b> (kies het goede woord in de zin).</p>' +
    '<button class="btn btn-green" data-act="start-flash-alle">Alle woorden — flashcards</button>' +
    '<button class="btn btn-accent" data-act="start-invul-alle">Alle woorden — invuloefening</button>' +
    '</div>' +
    '<div class="card"><h3>Woordjes per tekst</h3>' + opties + '</div>';
}

function viewTrainer() {
  if (trainer.pool.length === 0) {
    return '<div class="card"><h2>Klaar</h2><p>Je hebt alle woordjes in deze ronde gezien.</p>' +
      '<button class="btn btn-primary" data-act="nog-een-ronde">Nog een keer</button></div>';
  }
  if (trainer.i >= trainer.pool.length) {
    var pct = trainer.pool.length ? Math.round(100 * trainer.goed / trainer.pool.length) : 100;
    return '<div class="card" style="text-align:center">' +
      '<div class="label-boven">Ronde voltooid</div>' +
      '<div class="score-groot">' + trainer.goed + ' / ' + trainer.pool.length + '</div>' +
      '<div class="pbalk"><div style="width:' + pct + '%"></div></div>' +
      '<p class="meta">Elke dag een rondje = sterke woordenschat voor het examen.</p>' +
      '<button class="btn btn-primary" data-act="nog-een-ronde">Nog een ronde</button>' +
      '<button class="btn btn-soft" data-act="naar-woordjes">Terug naar woordjes</button>' +
      '</div>';
  }
  var w = trainer.pool[trainer.i];
  var info = WOORDEN[w];
  var g = geleerd().length;
  var voortgangRegel = '<div class="meta" style="text-align:center;margin-bottom:10px">Woord ' + (trainer.i + 1) + ' van ' + trainer.pool.length + ' · geleerd: ' + g + ' van ' + alleWoorden().length + '</div>';

  if (trainer.mode === "flash") {
    var binnen = trainer.flipped ?
      '<div class="flash">' +
      '<div class="groot">' + w + '</div>' +
      '<div class="uitleg">' + info.u + '</div>' +
      '<div class="vb">' + info.v + '</div>' +
      '</div>' :
      '<div class="flash" style="cursor:pointer" data-act="flip">' +
      '<div class="groot">' + w + '</div>' +
      '<div class="uitleg" style="opacity:.7">Tik op de kaart voor de uitleg</div>' +
      '</div>';
    return '<button class="terug" data-act="naar-woordjes">← Woordjes</button>' + voortgangRegel + binnen +
      (trainer.flipped ?
        '<button class="btn btn-green" data-act="flash-wist">Wist ik het</button>' +
        '<button class="btn btn-outline" data-act="flash-nog">Nog niet</button>' :
        '<button class="btn btn-soft btn-small" data-act="woord-luister" data-w="' + w + '">Voorlezen</button>');
  }

  /* invulmodus */
  var zin = info.v;
  function maakRe(p) { return new RegExp(p.replace(/[.*+?^${}()|[\]\\]/g, "\\" + "$" + "&"), "i"); }
  function probeer(p) { var z = zin.replace(maakRe(p), "___"); return z === zin ? null : z; }
  var vervang = probeer(w) || probeer(w.split(" ")[0]) || probeer(w.split(" ")[w.split(" ").length - 1]) || ("___ " + zin);
  var optiesHtml = trainer.opties.map(function (o, idx) {
    var cls = "optie";
    var dis = trainer.gekozen !== null ? " disabled" : "";
    if (trainer.gekozen !== null) {
      if (o === trainer.gevraagd) cls += " goed";
      else if (idx === trainer.gekozen) cls += " fout";
    }
    return '<button class="' + cls + '"' + dis + ' data-act="invul-antwoord" data-i="' + idx + '">' + o + '</button>';
  }).join("");
  var feedback = "";
  if (trainer.gekozen !== null) {
    var ok = trainer.opties[trainer.gekozen] === trainer.gevraagd;
    feedback = '<div class="waarom">' + (ok ? "<b>Goed.</b>" : "<b>Niet goed.</b> Het goede antwoord is <b>" + trainer.gevraagd + "</b>.") +
      ' ' + info.u + '<br>' + info.v + '</div>' +
      '<button class="btn btn-primary" data-act="invul-verder">Volgende</button>';
  }
  return '<button class="terug" data-act="naar-woordjes">← Woordjes</button>' + voortgangRegel +
    '<div class="invulzin">' + vervang.replace(/___/g, '<span class="blank">?</span>') + '</div>' +
    optiesHtml + feedback;
}

function viewSchrijven() {
  var swk = schrijfOpslag();
  var kaarten = SCHRIJF.map(function (o) {
    var rec = swk[o.id];
    var badge = rec && rec.afgerond ? '<span class="badge">Afgerond</span>' : (rec && rec.tekst ? '<span class="badge badge-blauw">Bezig</span>' : '<span class="badge badge-blauw">Nieuw</span>');
    return '<div class="card tekstcard" data-act="sw-open" data-id="' + o.id + '">' +
      '<h3>' + o.titel + '</h3>' +
      '<div class="meta">' + o.soort + ' · min. ' + o.minWoorden + ' woorden ' + badge + '</div>' +
      '</div>';
  }).join("");
  return '<div class="card">' +
    '<div class="label-boven">Schrijfvaardigheid</div>' +
    '<h2>Schrijfopdrachten</h2>' +
    '<p class="meta">Oefen het echte examenformaat: een e-mail of bericht met aanhef, duidelijke punten en een nette groet. Je bouwt je tekst op in vijf stappen en checkt jezelf met de exameneisen.</p>' +
    '</div>' + kaarten +
    '<div class="card"><p class="meta">Je tekst blijft op dit toestel en wordt automatisch bewaard. Je kunt later altijd verdergaan.</p></div>';
}

function viewSchrijf() {
  var o = swOpdracht();
  if (!o) return viewSchrijven();
  var opgeslagen = schrijfOpslag()[o.id] || {};
  var afgerond = opgeslagen.afgerond || false;

  var stappen = ["Situatie", "Woordweb", "Zinnen bouwen", "Schrijven", "Zelfcheck"];
  var balk = '<div class="stapbalk">' + stappen.map(function (s, i) {
    return '<span class="' + (i < sw.stap ? "aan" : "") + '"></span>';
  }).join("") + '</div>';
  var kop = '<button class="terug" data-act="naar-schrijven">← Schrijfopdrachten</button>' +
    '<div class="card">' +
    '<div class="label-boven">' + o.soort + '</div>' +
    '<h2>' + o.titel + '</h2>' +
    balk;

  /* ---- stap 1: situatie ---- */
  if (sw.stap === 1) {
    var taakLijst = '<ol style="margin:8px 0 14px;padding-left:20px">' + o.taak.map(function (p) { return "<li>" + p + "</li>"; }).join("") + '</ol>';
    return kop + '<p>' + o.situatie + '</p>' +
      '<div class="waarom"><b>Dit moet in je tekst staan (exameneisen):</b></div>' + taakLijst +
      '<p class="meta">Minimum: ' + o.minWoorden + ' woorden. Neem de tijd — je kunt later verdergaan.</p>' +
      '<button class="btn btn-primary" data-act="sw-stap" data-n="2">Volgende: woordweb</button>' +
      '</div>';
  }

  /* ---- stap 2: woordweb ---- */
  if (sw.stap === 2) {
    var chips = o.woordweb.map(function (w) {
      var aan = sw.woorden.indexOf(w) !== -1;
      return '<span class="chip ' + (aan ? "chip-aan" : "") + '" data-act="sw-woord" data-w="' + w + '">' + w + '</span>';
    }).join("");
    return kop + '<div class="stapnr"><b>2</b><span><b>Woordweb</b> — tik op woorden die je wilt gebruiken</span></div>' +
      '<p class="meta">Kies woorden die bij jouw tekst passen. Ze verschijnen in je notities bij het schrijven.</p>' +
      chips +
      '<div style="height:10px"></div>' +
      '<button class="btn btn-soft" data-act="sw-stap" data-n="1">Vorige</button>' +
      '<button class="btn btn-primary" data-act="sw-stap" data-n="3">Volgende: zinnen bouwen</button>' +
      '</div>';
  }

  /* ---- stap 3: starters ---- */
  if (sw.stap === 3) {
    var schips = o.starters.map(function (s) {
      var aan = sw.starters.indexOf(s) !== -1;
      return '<span class="chip ' + (aan ? "chip-aan" : "") + '" data-act="sw-starter" data-s="' + s.replace(/"/g, "&quot;") + '">' + s + '</span>';
    }).join("");
    var notitie = (sw.starters.length ? sw.starters.join("\n") + "\n" : "") + (sw.woorden.length ? "\nWoorden die ik ga gebruiken: " + sw.woorden.join(", ") : "");
    return kop + '<div class="stapnr"><b>3</b><span><b>Zinnen bouwen</b> — tik op startzinnen</span></div>' +
      '<p class="meta">Dit zijn zinnen zoals op het examen. Tik ze aan: ze komen klaar te staan in de schrijftekst.</p>' +
      schips +
      (notitie.trim() ? '<div class="label-boven" style="margin-top:12px">Mijn notities</div><div class="startersnotitie">' + notitie + '</div>' : '') +
      '<button class="btn btn-soft" data-act="sw-stap" data-n="2">Vorige</button>' +
      '<button class="btn btn-primary" data-act="sw-stap" data-n="4">Volgende: schrijven</button>' +
      '</div>';
  }

  /* ---- stap 4: schrijven ---- */
  if (sw.stap === 4) {
    var n = aantalWoorden(sw.tekst);
    var volgend = "";
    if (afgerond) {
      volgend = '<button class="btn btn-green" data-act="sw-stap" data-n="5">Naar de zelfcheck</button>';
    } else {
      volgend = '<button class="btn btn-primary" data-act="sw-stap" data-n="5" ' + (n < o.minWoorden ? "disabled" : "") + '>Volgende: zelfcheck</button>';
    }
    return kop + '<div class="stapnr"><b>4</b><span><b>Schrijven</b> — jouw tekst</span></div>' +
      '<p class="meta">Schrijf je e-mail of bericht hieronder. Gebruik je notities hierboven. De tekst wordt bewaard op dit toestel.</p>' +
      '<textarea id="swTekst" placeholder="Beste ...">' + (sw.tekst ? sw.tekst.replace(/</g, "&lt;") : "") + '</textarea>' +
      '<div class="meta" id="woordteller" style="text-align:right;margin-top:6px">' + n + ' woorden (min. ' + o.minWoorden + ')</div>' +
      '<button class="btn btn-soft" data-act="sw-stap" data-n="3">Vorige</button>' +
      volgend +
      '</div>';
  }

  /* ---- stap 5: zelfcheck ---- */
  var checks = o.checklist.map(function (c, i) {
    var aan = sw.checks.indexOf(i) !== -1;
    return '<button class="checkitem ' + (aan ? "aan" : "") + '" data-act="sw-check" data-i="' + i + '"><span class="checkbox"></span><span>' + c + '</span></button>';
  }).join("");
  var n2 = aantalWoorden(sw.tekst);
  var allesAan = sw.checks.length === o.checklist.length && n2 >= o.minWoorden;
  var jouwTekst = sw.toonJouwTekst || afgerond;
  var onder = "";
  if (jouwTekst) {
    onder += '<div class="label-boven" style="margin-top:14px">Jouw tekst</div><div class="voorbeeldtekst">' + (sw.tekst ? sw.tekst.replace(/</g, "&lt;") : "— nog leeg —") + '</div>';
  }
  if (sw.toonVoorbeeld || afgerond) {
    onder += '<div class="label-boven" style="margin-top:14px">Voorbeeld van een goed antwoord</div><div class="voorbeeldtekst">' + o.voorbeeld + '</div>' +
      '<p class="meta" style="margin-top:8px">Vergelijk: wat doet het voorbeeld goed? Wat kun jij de volgende keer verbeteren?</p>';
  }
  var knoppen = '';
  if (!afgerond) {
    knoppen = '<button class="btn btn-green" data-act="sw-rondaf" ' + (allesAan ? "" : "disabled") + '>Alles gecheckt: afronden</button>' +
      '<div class="sheetknoppen" style="margin-top:4px">' +
      '<button class="btn btn-soft btn-small" data-act="sw-voorbeeld">Voorbeeld bekijken</button>' +
      '<button class="btn btn-soft btn-small" data-act="sw-mijntekst">Mijn tekst bekijken</button>' +
      '</div>';
  } else {
    knoppen = '<p class="badge" style="display:inline-block;margin-bottom:12px">Afgerond</p>' +
      '<div class="sheetknoppen">' +
      '<button class="btn btn-soft btn-small" data-act="sw-voorbeeld">Voorbeeld</button>' +
      '<button class="btn btn-soft btn-small" data-act="sw-mijntekst">Mijn tekst</button>' +
      '<button class="btn btn-outline btn-small" data-act="sw-opnieuw">Opnieuw beginnen</button>' +
      '</div>';
  }
  return kop + '<div class="stapnr"><b>5</b><span><b>Zelfcheck</b> — controleer je tekst met de exameneisen</span></div>' +
      '<p class="meta">Tik elk punt aan dat klopt voor jouw tekst (' + n2 + ' woorden, min. ' + o.minWoorden + ').</p>' +
      checks + knoppen + onder +
      '<button class="btn btn-soft" data-act="sw-stap" data-n="4">Vorige: schrijven</button>' +
      '</div>';
}

function viewVoortgang() {
  var g = geleerd();
  var totaal = alleWoorden().length;
  var pct = Math.round(100 * g.length / totaal);
  var st = store("streak", { count: 0 });
  var sc = scores();
  var swk = schrijfOpslag();
  var scHtml = TEKSTEN.map(function (t) {
    var status = sc[t.id] ? "Vragen: <b>" + sc[t.id] + "</b>" : (gelezen().indexOf(t.id) !== -1 ? "Gelezen, vragen nog open" : "Nog niet begonnen");
    return '<div class="card"><h3>' + t.titel + '</h3><div class="meta">' + status + ' · ' + t.woorden.length + ' woorden</div></div>';
  }).join("");
  var swHtml = SCHRIJF.map(function (o) {
    var rec = swk[o.id];
    var status = rec && rec.afgerond ? "Afgerond" : (rec && rec.tekst ? "Bezig (" + aantalWoorden(rec.tekst) + " woorden)" : "Nog niet begonnen");
    return '<div class="card"><h3>' + o.titel + '</h3><div class="meta">' + o.soort + ' · ' + status + '</div></div>';
  }).join("");
  var motivatie = pct >= 80 ? "Bijna alle woorden onder de knie." : pct >= 40 ? "Goed bezig. Elke dag een klein stukje." : "Begin vandaag: vijf minuten woordjes maakt al verschil.";
  return '<div class="card">' +
    '<div class="label-boven">Voortgang</div>' +
    '<div class="stats">' +
    '<div class="stat"><b>' + st.count + '</b><small>dagen streak</small></div>' +
    '<div class="stat"><b>' + g.length + '/' + totaal + '</b><small>woorden geleerd</small></div>' +
    '</div>' +
    '<div class="pbalk"><div style="width:' + pct + '%"></div></div>' +
    '<p class="meta">' + motivatie + '</p>' +
    '</div>' +
    '<div class="card"><h3 style="font-size:16px;margin:0 0 8px">Schrijfopdrachten</h3>' + swHtml.replace(/class="card"/g, 'class="card" style="margin-bottom:8px;padding:12px 14px"') + '</div>' +
    scHtml +
    '<div class="card">' +
    '<button class="btn btn-outline" data-act="reset">Alles wissen</button>' +
    '<p class="meta">Je voortgang en teksten staan alleen op dit toestel. Alles wissen kan niet terug gedraaid worden.</p>' +
    '</div>';
}

/* ---------- events ---------- */
document.getElementById("app").addEventListener("click", function (e) {
  var woordEl = e.target.closest("[data-woord]");
  if (woordEl && !woordEl.hasAttribute("data-act")) { openWoord(woordEl.getAttribute("data-woord")); return; }

  var el = e.target.closest("[data-act]");
  if (!el) return;
  var act = el.getAttribute("data-act");
  var id = el.getAttribute("data-id");

  if (act === "open-tekst") openTekst(id);
  else if (act === "open-eerste-tekst") {
    var nogNiet = TEKSTEN.filter(function (t) { return gelezen().indexOf(t.id) === -1; });
    openTekst(nogNiet.length ? nogNiet[0].id : TEKSTEN[0].id);
  }
  else if (act === "open-schrijf-eerste") {
    var swk = schrijfOpslag();
    var openstaand = SCHRIJF.filter(function (o) { return !(swk[o.id] && swk[o.id].afgerond); });
    openSchrijf(openstaand.length ? openstaand[0].id : SCHRIJF[0].id);
  }
  else if (act === "laag") { cur.laag = el.getAttribute("data-laag"); render(); }
  else if (act === "lees-voor") {
    var lt = leesKaart();
    if (lt) leesVoor(plainText(lt[cur.laag]));
  }
  else if (act === "start-quiz") startQuiz(id);
  else if (act === "naar-teksten") ga("teksten");
  else if (act === "naar-woordjes") ga("woordjes");
  else if (act === "naar-schrijven") ga("schrijven");
  else if (act === "naar-voortgang") ga("voortgang");
  else if (act === "start-flash-alle") startTrainer("flash", "alle");
  else if (act === "start-flash-tekst") startTrainer("flash", id);
  else if (act === "start-invul-alle") startTrainer("invul", "alle");
  else if (act === "flip") { trainer.flipped = true; render(); }
  else if (act === "flash-wist") {
    addGeleerd(trainer.pool[trainer.i]);
    touchStreak();
    trainer.i++; trainer.flipped = false;
    toast("Woord geleerd");
    render();
  }
  else if (act === "flash-nog") { touchStreak(); trainer.i++; trainer.flipped = false; render(); }
  else if (act === "invul-antwoord") {
    if (trainer.gekozen === null) {
      trainer.gekozen = parseInt(el.getAttribute("data-i"), 10);
      if (trainer.opties[trainer.gekozen] === trainer.gevraagd) { trainer.goed++; addGeleerd(trainer.gevraagd); }
      touchStreak();
      render();
    }
  }
  else if (act === "invul-verder") { trainer.i++; trainer.gekozen = null; maakInvulVraag(); render(); }
  else if (act === "nog-een-ronde") startTrainer(trainer.mode, trainer.scope);
  else if (act === "qz-antwoord") {
    if (quiz.gekozen === null) {
      quiz.gekozen = parseInt(el.getAttribute("data-i"), 10);
      var qt = TEKSTEN.find(function (x) { return x.id === quiz.tekstId; });
      if (quiz.gekozen === qt.vragen[quiz.i].goed) { quiz.goed++; touchStreak(); }
      render();
    }
  }
  else if (act === "qz-verder") {
    var t2 = TEKSTEN.find(function (x) { return x.id === quiz.tekstId; });
    if (quiz.i === t2.vragen.length - 1) {
      var sc = scores();
      sc[quiz.tekstId] = quiz.goed + "/" + t2.vragen.length;
      set("scores", sc);
    }
    quiz.i++;
    quiz.gekozen = null;
    render();
    window.scrollTo(0, 0);
  }
  /* --- schrijfvaardigheid --- */
  else if (act === "sw-open") openSchrijf(id);
  else if (act === "sw-stap") swStap(parseInt(el.getAttribute("data-n"), 10));
  else if (act === "sw-woord") {
    var w = el.getAttribute("data-w");
    var pos = sw.woorden.indexOf(w);
    if (pos === -1) { sw.woorden.push(w); } else { sw.woorden.splice(pos, 1); }
    render();
  }
  else if (act === "sw-starter") {
    var s = el.getAttribute("data-s");
    var pos2 = sw.starters.indexOf(s);
    if (pos2 === -1) { sw.starters.push(s); } else { sw.starters.splice(pos2, 1); }
    render();
  }
  else if (act === "sw-check") {
    var ci = parseInt(el.getAttribute("data-i"), 10);
    var pos3 = sw.checks.indexOf(ci);
    if (pos3 === -1) { sw.checks.push(ci); } else { sw.checks.splice(pos3, 1); }
    render();
  }
  else if (act === "sw-rondaf") swRondAf();
  else if (act === "sw-voorbeeld") { sw.toonVoorbeeld = true; render(); }
  else if (act === "sw-mijntekst") { sw.toonJouwTekst = true; render(); }
  else if (act === "sw-opnieuw") {
    sw.tekst = ""; sw.checks = []; sw.starters = []; sw.woorden = []; sw.stap = 1; sw.toonVoorbeeld = false; sw.toonJouwTekst = false;
    var swk2 = schrijfOpslag();
    if (swk2[sw.id]) { swk2[sw.id] = { tekst: "", afgerond: false }; set("schrijf", swk2); }
    render();
  }
  else if (act === "reset") {
    if (confirm("Alles wissen? Je woorden, scores, schrijfteksten en streak verdwijnen van dit toestel.")) {
      ["geleerd", "gelezen", "scores", "streak", "schrijf"].forEach(function (k) { try { localStorage.removeItem("em2f_" + k); } catch (e) {} });
      render();
    }
  }
});

/* live woordenteller + bewaren tijdens het typen */
document.getElementById("app").addEventListener("input", function (e) {
  if (e.target && e.target.id === "swTekst") {
    sw.tekst = e.target.value;
    var n = aantalWoorden(sw.tekst);
    var teller = document.getElementById("woordteller");
    if (teller) { teller.textContent = n + " woorden (min. " + (swOpdracht() ? swOpdracht().minWoorden : 0) + ")"; }
  }
});
document.getElementById("app").addEventListener("blur", function (e) {
  if (e.target && e.target.id === "swTekst" && view === "schrijf") { swBewaarTekst(); }
}, true);

document.getElementById("sheetBack").addEventListener("click", sluitWoord);

document.getElementById("sheet").addEventListener("click", function (e) {
  var el = e.target.closest("[data-act]");
  if (!el) return;
  var act = el.getAttribute("data-act");
  var w = el.getAttribute("data-w");
  if (act === "woord-luister") {
    var info = WOORDEN[w];
    leesVoor(w + ". " + (info ? info.u : ""));
  } else if (act === "woord-geleerd") {
    addGeleerd(w);
    touchStreak();
    toast("Toegevoegd aan je woordjes");
    sluitWoord();
  } else if (act === "woord-close") {
    sluitWoord();
  }
});

document.querySelectorAll("#nav button").forEach(function (b) {
  b.addEventListener("click", function () { ga(b.getAttribute("data-nav")); });
});

/* ---------- start ---------- */
touchStreak();
render();
</script>
